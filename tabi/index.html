<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Router</title>
<meta name="apple-mobile-web-app-title" content="Router">
<meta name="application-name" content="Router">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#F6F5F2;--surface:#fff;--ink:#16181D;--sub:#80838C;--faint:#C3C5CB;--line:#ECEBE6;
  --acc:#FF5B3A;--acc-soft:#FFEEE9;--glass:rgba(255,255,255,.78);
  --sh:0 1px 2px rgba(20,20,30,.04),0 6px 20px rgba(20,20,30,.06);
  --sh2:0 10px 40px rgba(20,20,30,.16);
  --r:20px;--safe:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111214;--surface:#1B1C1F;--ink:#F2F2F3;--sub:#9A9DA5;--faint:#55585F;--line:#2A2B2F;
  --acc-soft:#3A2019;--glass:rgba(27,28,31,.8);--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
input,textarea,select{background:var(--bg);border:1px solid transparent;border-radius:14px;padding:11px 14px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
a{color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:500;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.plan-btn{flex:1;min-width:0;text-align:left;display:block}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--sub)}
.plan-btn h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.plan-btn h1 svg{width:16px;height:16px;color:var(--sub)}
.plan-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh);flex:none;transition:transform .12s}
.ibtn:active{transform:scale(.92)}
.ibtn.flat{background:none;box-shadow:none}

/* ---------- layout ---------- */
.panes{padding:4px 16px calc(160px + var(--safe))}
.pane{display:none;animation:fade .25s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#pane-map{position:fixed;inset:0;z-index:1;padding:0}
#pane-map.on{display:block}
#map{position:absolute;inset:0;background:var(--line)}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center;padding:24px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe));z-index:600;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh2);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);width:max-content;max-width:calc(100vw - 24px)}
.tab{display:flex;align-items:center;gap:5px;padding:10px 13px;white-space:nowrap;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);transition:all .2s}
.tab.on{background:var(--ink);color:var(--bg)}
.tab .cnt{font-size:10px;background:var(--acc);color:#fff;border-radius:999px;padding:0 6px;line-height:16px}

@media (min-width:1000px){
  .top{padding-left:28px;padding-right:28px;width:480px}
  .panes{width:480px;padding:4px 28px 120px}
  #pane-map{display:block!important;left:480px;top:0;border-left:1px solid var(--line)}
  .tab[data-tab="map"]{display:none}
  .tabbar{left:240px}
  .map-days{left:20px!important}
}

/* ---------- common ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s,opacity .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.acc{background:var(--acc);color:#fff;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.btn.danger{color:#E5484D}
.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;transition:all .15s}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.hscroll::-webkit-scrollbar{display:none}
.kicker{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:800;font-size:15.5px;letter-spacing:-.01em;line-height:1.35;word-break:break-word}
.meta{font-size:12px;color:var(--sub)}
.sec-head{display:flex;align-items:center;gap:8px;margin:28px 0 12px}
.sec-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.sec-head h2 span{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
.empty{text-align:center;padding:36px 20px;color:var(--sub);font-size:14px}
.empty .big{font-size:40px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* photo / placeholder */
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 70% 92%),hsl(calc(var(--h) + 40) 65% 86%));display:grid;place-items:center;flex:none}
@media (prefers-color-scheme:dark){.ph{background:linear-gradient(135deg,hsl(var(--h) 25% 22%),hsl(calc(var(--h) + 40) 25% 16%))}}
.ph>span{font-size:28px;filter:saturate(.9)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- schedule ---------- */
.days-row{margin-top:6px}
.day-chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);min-width:84px;transition:all .15s}
.day-chip small{font-size:10px;font-weight:800;letter-spacing:.12em;opacity:.6}
.day-chip b{font-size:13.5px;white-space:nowrap}
.day-chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.day-chip.add{justify-content:center;align-items:center;color:var(--acc);box-shadow:none;border:1.5px dashed color-mix(in srgb,var(--acc) 55%,transparent);background:transparent;flex-direction:row;gap:4px;font-weight:700;font-size:13px}
.day-set{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
.day-set .pill:first-child input{width:132px}.day-set .pill input[type=time]{width:104px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--sub)}
.pill input{background:none;border:none;padding:4px 2px;width:auto;min-width:0;color:var(--ink);font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 20px;padding:14px 6px}
.summary div{text-align:center;border-left:1px solid var(--line)}
.summary div:first-child{border:none}
.summary small{display:block;font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.summary b{font-size:18px;font-weight:800}
.summary b em{font-style:normal;font-size:11px;font-weight:700;margin-left:1px}
.tl{position:relative}
.row-wrap{position:relative}
.stop{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:stretch}
.time{display:flex;flex-direction:column;align-items:flex-end;padding-top:10px}
.time b{font-size:16px;font-weight:800}
.time span{font-size:11.5px;color:var(--sub);font-weight:600}
.stop-card{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:8px;text-align:left;width:100%;transition:transform .15s}
.stop-card:active{transform:scale(.985)}
.thumb-wrap{position:relative;flex:none}
.th{width:80px;height:80px;border-radius:14px}
.idx{position:absolute;top:-6px;left:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--acc);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px var(--surface)}
.stop-card .info{flex:1;min-width:0;padding:2px 0}
.handle{padding:14px 6px;color:var(--faint);cursor:grab;touch-action:none;align-self:stretch;display:flex;align-items:center}
.leg{display:grid;grid-template-columns:50px 1fr;gap:10px;min-height:46px;align-items:center}
.leg-line{justify-self:end;margin-right:-26px;width:2px;height:100%;background:repeating-linear-gradient(to bottom,var(--faint) 0 4px,transparent 4px 9px)}
.leg-pill{justify-self:start;margin-left:18px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--sub);padding:5px 12px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);transition:all .15s}
.leg-pill:hover{color:var(--ink)}
.leg-pill b{color:var(--ink)}
.leg-pill .warn{color:#D97706}
.ghost{opacity:.35}
.sortable-chosen .stop-card{box-shadow:var(--sh2)}
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 60px);margin:18px 0 0 60px;padding:14px;border-radius:var(--r);border:1.5px dashed var(--faint);color:var(--sub);font-weight:700;font-size:14px}
.add-row:hover{color:var(--acc);border-color:var(--acc)}
.end-mark{display:grid;grid-template-columns:50px 1fr;gap:10px;margin-top:14px;align-items:center}
.end-mark b{text-align:right;font-size:14px}
.end-mark span{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.08em}

/* ---------- stock ---------- */
.search-card{margin-top:6px;display:grid;gap:12px}
.search-card .ttl{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.field{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:14px;padding:0 4px 0 12px}
.field svg{color:var(--sub);width:18px;height:18px}
.field input{background:none;border:none;padding:12px 4px}
.field .ibtn{width:36px;height:36px;box-shadow:none;background:var(--surface)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.res-list{display:grid;gap:2px;margin:0 -6px}
.res{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:14px}
.res:hover{background:var(--bg)}
.res .ph{width:48px;height:48px;border-radius:12px}
.res .ph>span{font-size:20px}
.res .info{flex:1;min-width:0}
.res .name{font-size:14px}
.res-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);padding:4px 6px}
.state{font-size:13px;color:var(--sub);padding:10px 4px}
.state.err{color:#E5484D}
.ext{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.scard{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s}
.scard:active{transform:scale(.98)}
.scard .ph{width:100%;aspect-ratio:4/3}
.scard .sbody{padding:10px 12px 12px}
.scard .name{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);letter-spacing:.04em}
.add-fab{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--sh2);transition:transform .12s}
.add-fab:active{transform:scale(.9)}
.add-fab svg{width:18px;height:18px;stroke-width:2.4}
@media (min-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}

/* ---------- map overlays ---------- */
.map-days{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));left:16px;right:16px;z-index:400;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
@media (min-width:1000px){.map-days{top:20px}}
.map-days .chip{box-shadow:var(--sh)}
.carousel{position:absolute;left:0;right:0;bottom:calc(84px + var(--safe));z-index:400;display:flex;gap:10px;overflow-x:auto;padding:4px 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
@media (min-width:1000px){.carousel{bottom:20px}}
.carousel::-webkit-scrollbar{display:none}
.cc{flex:none;width:250px;scroll-snap-align:center;display:flex;gap:10px;align-items:center;padding:8px;border-radius:18px;background:var(--surface);box-shadow:var(--sh2);text-align:left;transition:outline .15s;outline:2px solid transparent}
.cc.hl{outline-color:var(--acc)}
.cc .ph{width:56px;height:56px;border-radius:12px}
.cc .ph>span{font-size:22px}
.cc .info{min-width:0;flex:1}
.cc .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:13px}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3.5px solid #8E939B;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:12px 14px;font:13px/1.5 inherit}
.leaflet-control-zoom{border:none!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-top{top:calc(64px + env(safe-area-inset-top,0px))}
@media (min-width:1000px){.leaflet-top{top:0}}

/* ---------- sheets ---------- */
.sheet-bg{position:fixed;inset:0;z-index:1000;background:rgba(12,12,18,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:bgIn .2s ease}
.sheet-bg.out{animation:bgOut .2s ease forwards}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + var(--safe));animation:up .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
.sheet.out{animation:down .2s ease forwards}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.sheet h3 span{flex:1}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:50%;transform:translate(-50%,50%);width:500px;border-radius:26px;max-height:86vh;animation:pop .25s cubic-bezier(.2,.9,.3,1)}.sheet.out{animation:popOut .18s ease forwards}.grabber{display:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,52%) scale(.96)}to{opacity:1;transform:translate(-50%,50%)}}
@keyframes popOut{to{opacity:0;transform:translate(-50%,52%) scale(.97)}}
@keyframes bgIn{from{opacity:0}}
@keyframes bgOut{to{opacity:0}}
.hero{margin:0 -18px 14px;height:220px;position:relative}
.hero .ph{width:100%;height:100%}
.hero .ph>span{font-size:64px}
.hero .chg{position:absolute;right:14px;bottom:14px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:none;color:var(--ink)}
@media (min-width:700px){.hero{margin-top:-8px;border-radius:26px 26px 0 0;overflow:hidden}}
.dname{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px;line-height:1.3}
.tline{display:flex;gap:16px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 14px;margin:12px 0}
.tline div small{display:block;font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.08em}
.tline div b{font-size:18px;font-weight:800}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:4px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface);font-size:18px;font-weight:700;box-shadow:var(--sh)}
.stepper b{min-width:76px;text-align:center;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 6px;letter-spacing:.04em}
.mode-list{display:grid;gap:6px}
.mode{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);text-align:left;border:2px solid transparent}
.mode.on{border-color:var(--ink);background:var(--surface)}
.mode .e{font-size:22px}
.mode .n{flex:1;font-weight:700}
.mode .t{font-weight:800}
.mode .t small{font-weight:600;color:var(--sub);margin-left:6px}
.plan-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;width:100%;text-align:left}
.plan-item.on{background:var(--bg)}
.plan-item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:800}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photo-grid button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg)}
.photo-grid img{width:100%;height:100%;object-fit:cover;display:block}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
#pickmap{height:200px;border-radius:16px;margin-top:8px}
.loc-res button{display:block;width:100%;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.sticky-foot{position:sticky;bottom:calc(-22px - var(--safe));margin:18px -18px calc(-22px - var(--safe));padding:12px 18px calc(16px + var(--safe));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sticky-foot .btn{flex:1}
.note{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6}

/* 現在地・訪問記録 */
.me{width:18px;height:18px;border-radius:50%;background:#2F80ED;border:3px solid #fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,128,237,.5)}70%{box-shadow:0 0 0 16px rgba(47,128,237,0)}100%{box-shadow:0 0 0 0 rgba(47,128,237,0)}}
.ibtn.live{background:#2F80ED;color:#fff;animation:pulse 2.4s infinite}
.pin.done{background:#1F9D74}
.idx.done{background:#1F9D74}
.done-ov{position:absolute;inset:0;border-radius:14px;background:rgba(31,157,116,.5);display:grid;place-items:center;color:#fff}
.done-ov svg{width:34px;height:34px;stroke-width:3}
.stop-card.done{background:color-mix(in srgb,#1F9D74 7%,var(--surface))}

.stamp{position:absolute;right:38px;top:10px;transform:rotate(-10deg);font-size:10px!important;border:2.5px solid #1F9D74;color:#1F9D74;font-weight:900;font-size:12px;letter-spacing:.12em;padding:2px 8px;border-radius:8px;opacity:.85;pointer-events:none}

.stop-card{position:relative}
.geo-bar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,#2F80ED 9%,var(--surface));font-size:12.5px;color:var(--ink)}

.leaflet-bar a.loc-btn svg{width:18px;height:18px}

/* 進捗：ゴーストレース＆ガント */
.race{margin-top:14px;padding:18px 16px 16px;overflow:hidden}
.race-status{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.race-status .emo{font-size:38px;line-height:1;animation:bob 1.6s ease-in-out infinite}
.race-status b{display:block;font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.race-status small{font-size:12.5px;color:var(--sub);font-weight:600}
.race-status.late b{color:#E5484D}.race-status.warn b{color:#D97706}.race-status.early b{color:#1F9D74}.race-status.ok b{color:var(--ink)}
.track{position:relative;height:96px;margin:14px 10px 4px}
.rail{position:absolute;left:0;right:0;top:62px;height:6px;border-radius:3px;background:var(--line)}
.fill{position:absolute;left:0;top:62px;height:6px;border-radius:3px;background:linear-gradient(90deg,#FFB199,var(--acc));transition:width 1s cubic-bezier(.3,.9,.3,1)}
.cp{z-index:3;position:absolute;top:59px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2.5px solid var(--faint)}
.cp.done{background:#1F9D74;border-color:#1F9D74}
.flag{position:absolute;right:-10px;top:46px;font-size:20px}
.tok{position:absolute;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1s cubic-bezier(.3,.9,.3,1)}

.ghost{opacity:.6;z-index:1;top:0;flex-direction:column-reverse}.ghost i{margin:0 0 2px}.ghost .ic{animation:float 2.2s ease-in-out infinite}.ghost i{background:var(--line);color:var(--sub)}
.runner{z-index:2}.runner .ic{transform:scaleX(-1);animation:run .5s ease-in-out infinite alternate}.runner i{background:var(--acc);color:#fff}

@keyframes float{50%{transform:translateY(-5px)}}
@keyframes run{to{transform:scaleX(-1) translateY(-4px) rotate(4deg)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
.gap-tag{position:absolute;top:74px;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--sub);white-space:nowrap}
.race-foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.race-foot b{color:var(--ink)}
.recover{margin-top:12px;width:100%;justify-content:flex-start;text-align:left;white-space:normal;background:color-mix(in srgb,#E5484D 8%,var(--surface));box-shadow:none;color:var(--ink);font-size:13px;border-radius:16px;padding:12px 14px}
.gantt-card{margin-top:14px;padding:14px 0 10px}
.gantt-card .ttl{display:flex;align-items:center;gap:8px;padding:0 16px 8px;font-weight:800}
.gantt-card .ttl span{flex:1}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);font-weight:600}
.lg i{display:inline-block;width:14px;height:6px;border-radius:3px}

.g-in{position:relative;padding:22px 0 6px}
.g-axis{position:absolute;top:0;left:0;right:0;height:100%;pointer-events:none}

.g-tick span{position:absolute;top:2px;left:4px;font-size:10.5px;color:var(--sub);font-weight:700}

.g-now span{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#E5484D;color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;white-space:nowrap}
.g-now::after{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:#E5484D;animation:pulse 2s infinite}

.empty .pk{display:block;margin:0 auto 10px;animation:pkbob 2.4s ease-in-out infinite}

.cele{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:bgIn .2s ease}

.confirm{border-radius:18px;padding:12px;background:var(--bg);animation:fade .25s ease}
.confirm{display:grid;grid-template-columns:minmax(0,1fr)}.confirm input{background:var(--surface);min-width:0}

.chip small{font-size:10.5px;opacity:.6;margin-left:2px}
.linkbtn{color:var(--acc);font-weight:700;font-size:12px;text-decoration:underline}
.slist{padding:4px 0;overflow:hidden}

.welcome{position:fixed;left:12px;right:12px;bottom:calc(150px + var(--safe));z-index:1500;background:var(--surface);border-radius:22px;box-shadow:var(--sh2);padding:14px;display:grid;gap:10px;animation:celePop .4s cubic-bezier(.2,1.4,.4,1);max-width:440px;margin:0 auto}

.rec{font-size:10px;font-weight:800;color:#fff;background:#1F9D74;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:2px}

/* LIVE */
.live-badge{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:900;letter-spacing:.1em;color:#fff;background:#1F9D74;border-radius:999px;padding:1px 7px 1px 6px;vertical-align:1px}

.live-badge.off{background:var(--faint)}.live-badge.off::before{animation:none}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe));transform:translateX(-50%);z-index:2000;background:var(--ink);color:var(--bg);padding:11px 8px 11px 18px;border-radius:999px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;box-shadow:var(--sh2);animation:tin .25s cubic-bezier(.2,.9,.3,1);width:max-content;max-width:calc(100vw - 32px)}

</style>

// 訪問記録のお祝い演出
function celebrate(name){
  document.querySelector('.cele')?.remove();
  const c=document.createElement('div');c.className='cele';
  const conf=Array.from({length:22},(_,i)=>`<i style="--x:${Math.cos(i/22*6.283)*(120+Math.random()*80)}px;--y:${Math.sin(i/22*6.283)*(120+Math.random()*80)-40}px;--r:${Math.random()*360}deg;--d:${(Math.random()*.15).toFixed(2)}s"></i>`).join('');
  c.innerHTML=`<div class="cele-in"><div class="conf">${conf}</div>${pinkun(120,'joy')}<b>VISITED!</b><span>「${esc(name)}」の訪問を記録しました</span></div>`;
  c.onclick=()=>c.remove();document.body.append(c);setTimeout(()=>{c.classList.add('out');setTimeout(()=>c.remove(),300)},2400);
}

const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gOf=k=>G[k]||G['その他'];
const hue=s=>[...String(s||'x')].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const toMin=t=>{const[h,m]=(t||'09:00').split(':').map(Number);return h*60+(m||0)};
const fmtT=x=>{x=Math.round(x);const d=Math.floor(x/1440),r=((x%1440)+1440)%1440;return (d>0?'翌':'')+String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')};
const dur=m=>{m=Math.round(m);return m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`};
const durS=m=>{m=Math.round(m);return m>=60?`${Math.floor(m/60)}<em>h</em>${m%60?String(m%60).padStart(2,'0')+'<em>m</em>':''}`:`${m}<em>m</em>`};
const WD='日月火水木金土';
const fmtDate=s=>{if(!s)return '';const d=new Date(s+'T00:00');return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const addDays=(s,n)=>{if(!s)return '';const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
function dist(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const hasLL=s=>s&&s.lat!=null&&s.lng!=null;
function legInfo(a,b,mode){if(!hasLL(a)||!hasLL(b))return null;const m=MODES[mode]||MODES.walk,km=dist(a,b)*m.f;return {km,min:Math.round(km/m.v*60+(km>0.05?m.w:0))}}
function suggestMode(a,b){if(!hasLL(a)||!hasLL(b))return 'walk';const k=dist(a,b);return k<1.2?'walk':k<80?'train':k<500?'shinkansen':'plane'}
const gmaps=s=>hasLL(s)?`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+(s.area||''))}`;
const gdir=(a,b,m)=>`https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=${MODES[m].g}`;
const gsearch=q=>'https://www.google.com/search?q='+encodeURIComponent(q);

function ph(s,cls,extra=''){return `<div class="ph ${cls}" style="--h:${hue(s.genre||s.name)}"><span>${iconOf(s)}</span>${s.photo?`<img src="${esc(s.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}${extra}</div>`}

/* ================= 保存（IndexedDB・写真も保存可能） ================= */
const IDB={d:null,
  open(){return this.d??=new Promise((res,rej)=>{const r=indexedDB.open('tabinote',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
let db,saveT;
function save(touch=true){if(db&&P()&&touch){P().u=Date.now();live.push(P())}clearTimeout(saveT);saveT=setTimeout(async()=>{
  try{await IDB.set('db',JSON.parse(JSON.stringify(db)))}catch(e){try{localStorage.setItem('tabinote',JSON.stringify(db))}catch(_){toast('保存できませんでした（容量不足の可能性）')}}},250)}
function mkPlan(title){return {id:uid(),title:title||'新しいプラン',days:[{date:'',start:'09:00',items:[]}],spots:[]}}
function normalize(x){
  if(!x||!Array.isArray(x.plans))return null;
  x.plans.forEach(p=>{delete p.scene;p.spots=(p.spots||[]).filter(Boolean);
    if(!p.days||!p.days.length)p.days=[{date:'',start:'09:00',items:[]}];
    p.days.forEach(d=>{d.start=d.start||'09:00';d.items=(d.items||[]).filter(i=>p.spots.some(s=>s.id===i.spot)).map(i=>({id:i.id||uid(),spot:i.spot,mode:MODES[i.mode]?i.mode:'walk',...(i.v?{v:i.v}:{})}))})});
  return x;
}
async function load(){
  let x=null;try{x=await IDB.get('db')}catch(_){}
  if(!x)for(const k of ['tabinote','odekake-planner-v1']){try{x=JSON.parse(localStorage.getItem(k));if(x)break}catch(_){}}
  db=normalize(x)||{plans:[]};
  if(!db.plans.length){const p=mkPlan('はじめてのプラン');db.plans.push(p)}
  if(!db.plans.some(p=>p.id===db.cur))db.cur=db.plans[0].id;
  save();
}

const ui={tab:'plan',day:0,fArea:'',fGenre:'グルメ',fRad:1000,fRes:null,fState:'',here:null,showCands:true,fArea2:'',fGenre2:'',hl:null,lastExt:''};
const UIKEY='router-ui';
try{Object.assign(ui,JSON.parse(localStorage.getItem(UIKEY))||{})}catch(_){}
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify({tab:ui.tab,day:ui.day,fArea:ui.fArea,fGenre:ui.fGenre,lastExt:ui.lastExt,lastKind:ui.lastKind,geoHide:ui.geoHide}))}catch(_){}}
const wide=matchMedia('(min-width:1000px)');
const P=()=>db.plans.find(p=>p.id===db.cur)||db.plans[0];
const S=id=>P().spots.find(s=>s.id===id);
const D=()=>{const p=P();if(ui.day>=p.days.length)ui.day=p.days.length-1;return p.days[ui.day]};
function calc(d){
  let t=toMin(d.start),move=0,km=0,stay=0;
  const rows=d.items.map((it,i)=>{const s=S(it.spot);let leg=null;
    if(i>0){leg=legInfo(S(d.items[i-1].spot),s,it.mode);if(leg){t+=leg.min;move+=leg.min;km+=leg.km}}
    const arr=t,st=+s.stay||0;t+=st;stay+=st;return {it,s,i,leg,arr,dep:t}});
  return {rows,end:t,move,km,stay};
}
function usedIn(sid){const r=[];P().days.forEach((d,di)=>d.items.forEach((it,i)=>{if(it.spot===sid)r.push({di,i})}));return r}
function addToDay(sid,di=ui.day,silent){
  const d=P().days[di],prev=d.items.length?S(d.items.at(-1).spot):null;
  d.items.push({id:uid(),spot:sid,mode:prev?suggestMode(prev,S(sid)):'walk'});
  save();if(!silent)toast(`DAY ${di+1} の ${d.items.length}件目に追加しました`);
}

function renderPlan(){

  if(!c.rows.length){
    h+=`<div class="card empty" style="margin-top:16px">${pinkun(88)}<b>まだ予定がありません</b>行きたい場所を候補から追加しましょう。<div style="margin-top:16px"><button class="btn pri" data-act="goStock">${I.search}スポットを探す</button></div></div>`;
  }else{
    h+=`<div class="card summary num"><div><small>START</small><b>${fmtT(toMin(d.start))}</b></div><div><small>END</small><b>${fmtT(c.end)}</b></div><div><small>MOVE</small><b>${durS(c.move)}</b></div><div><small>${c.rows.some(r=>r.it.v)?'VISITED':'SPOTS'}</small><b>${c.rows.some(r=>r.it.v)?c.rows.filter(r=>r.it.v).length+'<em>/'+c.rows.length+'</em>':c.rows.length}</b></div></div><div class="tl" id="tl">`;

      <div class="stop"><div class="time num"><b>${fmtT(arr)}</b><span>${fmtT(dep)}</span></div>
        <div class="stop-card ${it.v?'done':''} ${GEO.justDone===it.id?'pop':''}" role="button" tabindex="0" data-act="detail" data-sid="${s.id}" data-i="${i}">

          <div class="info"><div class="kicker">${i+1}件目 · ${gOf(s.genre).e} ${esc(s.genre||'その他')}</div><div class="name">${esc(s.name)}</div><div class="meta">滞在 ${dur(+s.stay||0)}${s.area?' · '+esc(s.area):''}</div>${visitLine(it)}</div>

    <div class="note" style="margin-left:60px">移動時間は距離からの目安です。区間をタップすると移動手段の変更やGoogleマップでの経路確認ができます。</div>`;
  }
  $('#pane-plan').innerHTML=h;
  const tl=$('#tl');
  if(tl&&window.Sortable)Sortable.create(tl,{handle:'[data-handle]',animation:180,ghostClass:'ghost',onEnd(e){

      const n=norm(s.name),hit=(j.query?.geosearch||[]).find(g=>{const t=norm(g.title);return t.length>1&&(t.includes(n)||n.includes(t))});

async function geocode(q){
  try{const j=await getJSON('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q),10000);
    if(j.length){const [lng,lat]=j[0].geometry.coordinates;return {lat,lng}}}catch(_){}
  try{const j=await getJSON(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q=${encodeURIComponent(q)}`,10000);
    if(j.length)return {lat:+j[0].lat,lng:+j[0].lon}}catch(_){}
  throw new Error(`「${q}」の場所を特定できませんでした。駅名や住所で入力し直すか、現在地ボタンをお試しください。`);
}
async function overpass(q){
  for(const u of OVERPASS){try{return await getJSON(u+'?data='+encodeURIComponent(q),25000)}catch(_){}}
  throw new Error('施設データのサーバーに接続できませんでした。通信環境を確認するか、下のリンクからお探しください。');
}
function tagPhoto(t){
  if(t.image&&/^https:\/\/.+\.(jpe?g|png|webp)$/i.test(t.image))return t.image;
  const c=t.wikimedia_commons;if(c&&/^File:/i.test(c))return `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(c.slice(5))}?width=640`;
  return '';
}

      return {name:t['name:ja']||t.name,lat,lng,url:t.website||t['contact:website']||'',hours:t.opening_hours||'',cuisine:t.cuisine||'',photo:tagPhoto(t),wiki:t.wikipedia||'',d:dist(c,{lat,lng})}})
      .filter(x=>x.name&&x.lat!=null&&!seen.has(x.name)&&seen.add(x.name)).sort((a,b)=>a.d-b.d).slice(0,60);
    ui.fState='ok';
  }catch(err){ui.fState=(err.message||'検索に失敗しました')+(location.protocol==='file:'?'（ファイルを直接開いていると通信が制限される場合があります）':'')}

/* --- 共有（グループ） --- */
const b64u={enc:u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');const s=atob(t);return Uint8Array.from(s,c=>c.charCodeAt(0))}};
async function pack(p){
  const x=JSON.parse(JSON.stringify(p));x.spots.forEach(s=>{if(String(s.photo||'').startsWith('data:'))delete s.photo;delete s.pt});
  const raw=new TextEncoder().encode(JSON.stringify(x));
  if(window.CompressionStream){const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return 'z'+b64u.enc(new Uint8Array(buf))}
  return 'j'+b64u.enc(raw);
}
async function unpack(t){
  const bytes=b64u.dec(t.slice(1));
  if(t[0]==='z'){const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();return JSON.parse(new TextDecoder().decode(buf))}
  return JSON.parse(new TextDecoder().decode(bytes));
}

const FBV='10.12.2';
const live={
  fb:null,subs:{},timers:{},last:{},
  async init(){
    if(this.fb)return this.fb;
    if(window.__FB_MOCK)return this.fb=window.__FB_MOCK;
    if(!FIREBASE_CONFIG)return null;
    const [A,F,U]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`)]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=U.getAuth(app);await U.signInAnonymously(auth);
    const store=F.getFirestore(app);
    return this.fb={uid:auth.currentUser.uid,
      get:async id=>{const d=await F.getDoc(F.doc(store,'groups',id));return d.exists()?d.data():null},
      set:(id,v)=>F.setDoc(F.doc(store,'groups',id),v),
      watch:(id,cb)=>F.onSnapshot(F.doc(store,'groups',id),d=>cb(d.exists()?d.data():null))};
  },
  strip(p){const x=JSON.parse(JSON.stringify(p));delete x.su;x.spots.forEach(s=>{if(String(s.photo||'').startsWith('data:'))delete s.photo;delete s.pt});return x},
  body(p){const x=this.strip(p);delete x.u;return JSON.stringify(x)},
  push(p){
    if(!p?.gid||!this.fb)return;
    clearTimeout(this.timers[p.gid]);
    this.timers[p.gid]=setTimeout(async()=>{
      const body=this.body(p);if(this.last[p.gid]===body)return;
      try{await this.fb.set(p.gid,{data:JSON.stringify(this.strip(p)),u:p.u,by:this.fb.uid,name:db.me||''});this.last[p.gid]=body;p.su=p.u;setLive('ok')}
      catch(e){setLive('err')}
    },700);
  },
  apply(gid,r){
    if(!r)return;
    const p=db.plans.find(x=>x.gid===gid);if(!p)return;
    if(r.by===this.fb.uid&&r.u<=(p.u||0))return;          // 自分の書き込み
    if(r.u<=(p.su||0)&&r.u<=(p.u||0))return;               // 既に反映済み
    let x;try{x=JSON.parse(r.data)}catch(_){return}
    x=normalize({plans:[x]}).plans[0];
    x.spots.forEach(s=>{const o=p.spots.find(y=>y.id===s.id);if(o&&!s.photo&&o.photo)s.photo=o.photo});
    x.id=p.id;x.gid=gid;x.u=r.u;x.su=r.u;
    db.plans[db.plans.indexOf(p)]=x;this.last[gid]=this.body(x);
    save(false);render();if(SHEETS.length&&detail)refreshSheet();
    if(r.by!==this.fb.uid&&x.id===db.cur)toast(`${r.name||'メンバー'}さんがプランを更新しました`);
  },
  watch(p){
    if(!p.gid||this.subs[p.gid])return;
    this.subs[p.gid]=this.fb.watch(p.gid,r=>this.apply(p.gid,r));
  },
  async start(){
    const fb=await this.init().catch(()=>null);if(!fb)return toast('サーバーに接続できませんでした');
    const p=P();if(!p.gid){const a=new Uint8Array(18);crypto.getRandomValues(a);p.gid=b64u.enc(a).replace(/[-_]/g,'x')}
    p.u=Date.now();await fb.set(p.gid,{data:JSON.stringify(this.strip(p)),u:p.u,by:fb.uid,name:db.me||''});this.last[p.gid]=this.body(p);p.su=p.u;
    save(false);this.watch(p);render();refreshSheet();this.invite();
  },
  async invite(){
    const p=P(),url=location.href.split('#')[0]+'#g='+p.gid,text=`「${p.title}」をRouterで一緒に計画しよう！開くとグループに参加できます。`;
    try{if(navigator.share){await navigator.share({title:p.title,text,url});return}}catch(e){if(e.name==='AbortError')return}
    try{await navigator.clipboard.writeText(text+'\n'+url);toast('招待リンクをコピーしました')}catch(_){toast('招待リンク：'+url)}
  },
  async join(gid){
    const fb=await this.init().catch(()=>null);if(!fb)return toast('リアルタイム共有に接続できませんでした');
    let r=null;try{r=await fb.get(gid)}catch(_){}
    if(!r)return toast('グループが見つかりませんでした');
    let x;try{x=JSON.parse(r.data)}catch(_){return toast('グループのデータを読み込めませんでした')}
    incoming={...x,gid,_live:r};openSheet(joinHTML);
  },
  leave(){const p=P();if(this.subs[p.gid]){this.subs[p.gid]();delete this.subs[p.gid]}delete p.gid;delete p.su;save(false);render();closeSheet();toast('このプランの共有をやめました（手元には残ります）')},
  async boot(){if(!db.plans.some(p=>p.gid))return;const fb=await this.init().catch(()=>null);if(!fb)return setLive('err');db.plans.forEach(p=>this.watch(p))}
};

  if(f==='paste'){clearTimeout(pasteT);const v=e.target.value;pasteT=setTimeout(()=>{if(v.trim().length>=2)handlePaste(v)},900);return}
  if(f==='pst.name'&&ui.pst){ui.pst.name=e.target.value;return}
  if(f==='pst.area'&&ui.pst){ui.pst.area=e.target.value;return}
  if(f==='memo'&&detail){S(detail.sid).memo=e.target.value;save();return}
  if(f==='title'){P().title=e.target.value||'無題のプラン';save();renderHeader()}
  if(f==='me'){db.me=e.target.value.trim().slice(0,20);save(false)}
});
document.addEventListener('change',e=>{const f=e.target.dataset.f,p=P(),d=D();
  if(f==='date'){const prev=d.date;d.date=e.target.value;
    p.days.forEach((x,i)=>{if(i>ui.day&&(!x.date||(prev&&x.date===addDays(prev,i-ui.day))))x.date=addDays(d.date,i-ui.day)});save();render()}
  else if(f==='start'){d.start=e.target.value||'09:00';save();render()}

  else if((f==='pst.name'||f==='pst.area')&&ui.pst&&ui.pst.locLabel!=='Googleマップの位置'){ui.pst.lat=ui.pst.lng=null;locate(ui.pst)}
});
$('#fileImport').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const x=normalize(JSON.parse(await f.text()));if(!x)throw 0;let n=0;x.plans.forEach(p=>{if(!db.plans.some(q=>q.id===p.id)){db.plans.push(p);n++}});
    save();closeSheet();render();toast(`${n}件のプランを読み込みました`)}catch(_){toast('読み込めないファイルです')}};
wide.addEventListener('change',()=>{if(MAP)setTimeout(()=>MAP.invalidateSize(),50);render()});

/* ================= 進捗（ゴーストレース・ガント） ================= */
const TODAY=()=>new Date().toLocaleDateString('sv-SE');
function progress(d){
  const c=calc(d);if(!c.rows.length)return null;
  const base=new Date((d.date||TODAY())+'T00:00').getTime(),now=Date.now();
  const rows=c.rows.map(r=>({...r,A:base+r.arr*60e3,Dp:base+r.dep*60e3}));
  const live=it=>GEO.watch!=null&&presence&&presence.iid===it.id&&now-presence.last<3*60e3;
  let k=-1;rows.forEach((r,i)=>{if(r.it.v||live(r.it))k=i});
  const start=rows[0].A,end=rows.at(-1).Dp;let delay=0,state;
  if(k<0){state=now<start?'pre':'run';delay=state==='run'?now-start:0}
  else{const r=rows[k],v=r.it.v;
    if(live(r.it)||!v){delay=Math.max((v?v.a:presence.since)-r.A,now-r.Dp);state='at'}
    else if(rows[k+1]){delay=Math.max(v.d-r.Dp,now-rows[k+1].A);state='move'}
    else{delay=v.d-r.Dp;state='goal'}}
  return {rows,k,start,end,delay,state,now,live};
}
function raceHTML(g,d){
  const m=Math.round(g.delay/60e3),am=Math.abs(m),span=Math.max(1,g.end-g.start);
  const pos=t=>Math.max(0,Math.min(100,(t-g.start)/span*100));
  let cls='ok',emo='👌',big='ほぼ予定どおり',sub='';
  const fin=new Date(g.end+g.delay);
  if(g.state==='pre'){const w=g.start-g.now;cls='ok';emo='⏳';big=w>864e5?`スタートまで あと${Math.ceil(w/864e5)}日`:`スタートまで あと${dur(w/60e3)}`;sub=`${fmtDate(d.date||TODAY())} ${fmtT(toMin(d.start))} スタート`}
  else if(g.state==='goal'){emo='🏁';big='ゴール！';cls=m>5?'late':m<-5?'early':'ok';sub=am<=5?'ほぼ予定どおりにフィニッシュ':`予定より${am}分${m>0?'おそく':'はやく'}フィニッシュ`}
  else{
    if(m<=-5){cls='early';emo='⚡';big=`${am}分はやい`}
    else if(m<5){cls='ok';emo='👌';big='予定どおり'}
    else if(m<20){cls='warn';emo='🐢';big=`${m}分おくれ`}
    else{cls='late';emo='🔥';big=`${m}分おくれ`}
    sub=`ゴール予想 ${String(fin.getHours()).padStart(2,'0')}:${String(fin.getMinutes()).padStart(2,'0')}（予定 ${fmtT(calc(d).end)}）`;
    if(g.state==='run')sub+=' · 訪問記録なし';
  }
  const ghostP=g.state==='pre'?0:pos(g.now),youP=g.state==='pre'?0:g.state==='goal'?100:pos(g.now-g.delay);
  const next=g.state==='pre'||g.state==='run'?g.rows[0]:g.state==='goal'?null:g.state==='at'?g.rows[g.k+1]:g.rows[g.k+1];
  let rec='';
  if(m>=10&&g.state!=='goal'&&g.state!=='pre'){
    const from=g.state==='at'?g.k+1:Math.max(0,g.k+1);
    const cand=g.rows.slice(from).filter(r=>!r.it.v&&(+r.s.stay||0)>=30).sort((a,b)=>b.s.stay-a.s.stay)[0];
    if(cand){const cut=Math.min(Math.ceil(m/5)*5,cand.s.stay-15);if(cut>=5)rec=`<button class="btn recover" data-act="recover" data-i="${cand.i}" data-m="${cut}">💡 <span><b>リカバリー案</b><br>「${esc(cand.s.name)}」の滞在を${cut}分短くして遅れを取り戻す</span></button>`}
  }
  return `<div class="card race">
    <div class="eyebrow">GHOST RACE · DAY ${ui.day+1}</div>
    <div class="race-status ${cls}"><span class="emo">${emo}</span><div><b class="num">${big}</b><small>${sub}</small></div></div>
    <div class="track"><div class="rail"></div><div class="fill" style="width:${youP}%"></div>
      ${g.rows.map(r=>`<div class="cp ${r.it.v?'done':''}" role="button" data-act="detail" data-sid="${r.s.id}" data-i="${r.i}" style="left:${pos(r.A)}%;cursor:pointer" title="${esc(r.s.name)}"></div>`).join('')}
      <div class="flag">🏁</div>
      ${g.state!=='goal'&&g.state!=='pre'?`<div class="tok ghost" style="left:${ghostP}%"><span class="ic">👻</span><i>予定</i></div>`:''}
      <div class="tok runner ${g.state==='at'||g.state==='pre'||g.state==='goal'?'stop':''}" style="left:${youP}%"><span class="ic pkw">${pinkun(30,"",false)}</span><i>あなた</i></div>
      ${g.state!=='goal'&&g.state!=='pre'&&am>=5?`<div class="gap-tag" style="left:${(ghostP+youP)/2}%">${m>0?'◀':'▶'} ${am}分</div>`:''}
    </div>
    <div class="race-foot">${next?`<span>次は <b role="button" data-act="detail" data-sid="${next.s.id}" data-i="${next.i}" style="text-decoration:underline;text-underline-offset:3px;cursor:pointer">${esc(next.s.name)}</b></span><span class="num">予定 ${fmtT(next.arr)} 着${g.state!=='pre'?` · ${next.A-g.now>0?'あと'+dur((next.A-g.now)/60e3):dur((g.now-next.A)/60e3)+'超過'}`:''}</span>`:`<span>おつかれさまでした！</span><span>${g.rows.filter(r=>r.it.v).length}/${g.rows.length} スポット訪問</span>`}</div>
    ${rec}
  </div>`;
}
function ganttHTML(g){
  const PX=1.15,acts=g.rows.flatMap(r=>r.it.v?[r.it.v.a,r.it.v.d]:[]);
  let T0=Math.min(g.start,...acts),T1=Math.max(g.end,...acts);
  const showNow=g.now>T0-3*36e5&&g.now<T1+3*36e5;if(showNow){T0=Math.min(T0,g.now);T1=Math.max(T1,g.now)}
  T0=Math.floor((T0-30*60e3)/36e5)*36e5;T1=Math.ceil((T1+30*60e3)/36e5)*36e5;
  const x=t=>(t-T0)/60e3*PX,W=x(T1);
  let ticks='';for(let t=T0;t<=T1;t+=36e5){const h=new Date(t);ticks+=`<div class="${h.getHours()===0?'g-day':'g-tick'}" style="left:${x(t)}px"><span>${h.getHours()===0?(h.getMonth()+1)+'/'+h.getDate()+' ':''}${h.getHours()}:00</span></div>`}
  const rows=g.rows.map((r,i)=>{
    const v=r.it.v,lv=g.live(r.it)&&!v,miss=!v&&!lv&&g.now>r.Dp&&g.k>i;
    const prev=g.rows[i-1];
    return `<div class="g-row">
      ${prev?`<div class="g-leg" style="left:${x(prev.Dp)}px;width:${Math.max(0,x(r.A)-x(prev.Dp))}px"><span>${MODES[r.it.mode].e}</span></div>`:''}
      <div role="button" data-act="detail" data-sid="${r.s.id}" data-i="${i}" class="g-bar ${v?'done':''} ${lv?'cur':''} ${miss?'miss':''}" style="left:${x(r.A)}px;width:${Math.max(26,x(r.Dp)-x(r.A))}px" title="${esc(r.s.name)}"><b>${v?'✓':i+1}</b>${esc(r.s.name)}</div>
      ${v?`<div class="g-act" style="left:${x(v.a)}px;width:${Math.max(4,x(v.d)-x(v.a))}px"></div>`:''}
      ${lv?`<div class="g-act live" style="left:${x(presence.since)}px;width:${Math.max(4,x(g.now)-x(presence.since))}px"></div>`:''}
    </div>`}).join('');
  return `<div class="card gantt-card"><div class="ttl"><span>タイムライン</span><span class="lg"><i style="background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)"></i>予定</span><span class="lg"><i style="background:#1F9D74"></i>実績</span></div>
    <div class="gantt" id="gantt"><div class="g-in" style="width:${W}px"><div class="g-axis">${ticks}</div>${rows}
    ${showNow?`<div class="g-now" style="left:${x(g.now)}px"><span>NOW ${hmS(g.now)}</span></div>`:''}</div></div>
    <div class="note" style="padding:0 16px">帯をタップすると詳細を確認・変更できます。</div></div>`;
}
const hmS=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function renderProg(){
  const el=$('#pane-prog');if(!el)return;
  const p=P(),d=D(),g=progress(d);
  let h=p.days.length>1?`<div class="hscroll days-row">${p.days.map((x,i)=>`<button class="day-chip ${i===ui.day?'on':''}" data-act="day" data-i="${i}"><small>DAY ${i+1}</small><b>${x.date?fmtDate(x.date):x.items.length+'件'}</b></button>`).join('')}</div>`:'';
  if(!g){el.innerHTML=h+`<div class="card empty" style="margin-top:16px">${pinkun(88)}<b>予定を作るとレースが始まります</b>スケジュールにスポットを追加すると、予定と実際の進み具合を比べられます。<div style="margin-top:16px"><button class="btn pri" data-act="goStock">${I.search}スポットを探す</button></div></div>`;return}
  if(!d.date)h+=`<div class="geo-bar" style="margin-top:12px">📅<span>日付が未設定のため<b>今日</b>として表示しています。</span><button class="btn sm" data-act="progDate">今日に設定</button></div>`;
  h+=raceHTML(g,d)+ganttHTML(g);
  if(GEO.watch==null)h+=`<div class="geo-bar">📍<span>おでかけモードをONにすると、到着・出発が自動で記録され、進捗に反映されます。</span><button class="btn sm" data-act="geo">ON</button></div>`;
  h+=`<div class="note">進捗は訪問記録（自動・手動の✓）をもとに計算しています。</div>`;
  const sc=$('#gantt')?.scrollLeft;
  el.innerHTML=h;
  const gt=$('#gantt'),nw=gt?.querySelector('.g-now');
  if(gt){if(ui.gScroll||sc==null){ui.gScroll=0;gt.scrollLeft=nw?nw.offsetLeft-gt.clientWidth/3:0}else gt.scrollLeft=sc}
}
setInterval(()=>{if(document.visibilityState==='visible'&&(ui.tab==='prog'))renderProg()},30000);

/* ================= 現在地・滞在記録 ================= */
const GEO={watch:null,pos:null,wake:null,me:null,acc:null,fly:0,justDone:null,lastMin:-1};
let presence=null;try{presence=JSON.parse(localStorage.getItem('tabinote-presence'))}catch(_){}
const STAY_MS=10*60e3;
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function visitText(v){return v.m&&v.d-v.a<60e3?`訪問済み（${hm(v.a)}）`:`${hm(v.a)}〜${hm(v.d)} 滞在${dur((v.d-v.a)/60e3)}`}
function visitLine(it){
  if(it.v)return `<div class="visit">✓ ${visitText(it.v)}</div>`;
  if(GEO.watch!=null&&presence&&presence.iid===it.id){const st=Date.now()-presence.since,pc=Math.min(100,st/STAY_MS*100);
    return `<div class="here">📍 いまここ · あと${Math.max(1,Math.ceil((STAY_MS-st)/60e3))}分で滞在を記録</div><div class="prog"><i style="width:${pc}%"></i></div>`}
  return '';
}
function geoBar(){
  if(GEO.watch==null)return ui.geoHide?'':`<div class="geo-bar">📍<span><b>おでかけモード</b><br><span class="meta">現在地の表示と、10分以上の滞在を自動で記録</span></span><button class="btn sm" data-act="geo">ON</button><button class="qx" data-act="geoHide" aria-label="この案内を閉じる">${I.x}</button></div>`;
  return `<div class="geo-bar"><span class="me" style="flex:none;width:12px;height:12px;border-width:2px"></span><span><b>おでかけモード中</b>${GEO.pos?'':' · 現在地を取得中…'}<br><span class="meta">アプリを開いている間、自動で記録</span></span><button class="btn sm" data-act="geo">OFF</button></div>`;
}
async function wake(){try{if('wakeLock' in navigator&&GEO.watch!=null&&!GEO.wake){GEO.wake=await navigator.wakeLock.request('screen');GEO.wake.addEventListener('release',()=>GEO.wake=null)}}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
function startGeo(quiet){
  if(!navigator.geolocation){toast('この端末では位置情報を使えません');return}
  if(GEO.watch!=null)return;
  GEO.watch=navigator.geolocation.watchPosition(onPos,onGeoErr,{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  try{localStorage.setItem('tabinote-geo','1')}catch(_){}
  wake();render();if(!quiet)toast('おでかけモードON：10分以上の滞在を自動で記録します');
}
function stopGeo(quiet){
  if(GEO.watch!=null)navigator.geolocation.clearWatch(GEO.watch);GEO.watch=null;GEO.pos=null;
  try{localStorage.removeItem('tabinote-geo')}catch(_){}
  GEO.wake&&GEO.wake.release();GEO.wake=null;render();if(!quiet)toast('おでかけモードをOFFにしました');
}
function onGeoErr(e){if(e.code===1){stopGeo(1);toast('位置情報が許可されていません。端末の設定で許可してください')}}
function onPos(p){
  GEO.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||50};
  drawMe();
  if(GEO.fly&&MAP){GEO.fly=0;MAP.flyTo([GEO.pos.lat,GEO.pos.lng],16,{duration:.6})}
  detect();
}
function drawMe(){
  if(!MAP)return;document.querySelector('.loc-btn')?.classList.toggle('on',GEO.watch!=null);
  if(!GEO.pos||GEO.watch==null){if(GEO.me){GEO.me.remove();GEO.acc.remove();GEO.me=GEO.acc=null}return}
  const ll=[GEO.pos.lat,GEO.pos.lng];
  if(!GEO.me){GEO.acc=L.circle(ll,{radius:GEO.pos.acc,color:'#2F80ED',weight:1,opacity:.4,fillOpacity:.1,interactive:false}).addTo(MAP);
    GEO.me=L.marker(ll,{zIndexOffset:3000,interactive:false,icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18]})}).addTo(MAP)}
  else{GEO.me.setLatLng(ll);GEO.acc.setLatLng(ll).setRadius(GEO.pos.acc)}
}
function detect(){
  const now=Date.now(),pos=GEO.pos,R=Math.max(80,Math.min(pos.acc+40,250)),today=new Date().toLocaleDateString('sv-SE');
  const near=[];
  P().days.forEach((d,di)=>d.items.forEach(it=>{const s=S(it.spot);if(!hasLL(s))return;const m=dist(pos,s)*1000;if(m<=R)near.push({it,s,m,di,today:d.date===today})}));
  near.sort((a,b)=>(!!a.it.v-!!b.it.v)||(b.today-a.today)||((b.di===ui.day)-(a.di===ui.day))||(a.m-b.m));
  const best=near[0];let changed=false;
  if(best){
    if(presence&&presence.iid===best.it.id&&now-presence.last<5*60e3)presence.last=now;
    else{presence={iid:best.it.id,since:now,last:now};changed=true}
    const v=best.it.v;
    if(v&&presence.mark){v.d=now;save()}
    else if(!v&&now-presence.since>=STAY_MS){best.it.v={a:presence.since,d:now};presence.mark=1;changed=true;save();
      GEO.justDone=best.it.id;setTimeout(()=>{GEO.justDone=null},1500);
      navigator.vibrate&&navigator.vibrate([90,60,90]);celebrate(best.s.name)}
  }else if(presence&&now-presence.last>2*60e3){presence=null;changed=true}
  try{localStorage.setItem('tabinote-presence',JSON.stringify(presence))}catch(_){}
  const mi=Math.floor(now/60e3);
  if(changed||mi!==GEO.lastMin){GEO.lastMin=mi;renderPlan();renderHeader();renderProg();if(MAP&&(ui.tab==='map'||wide.matches))drawMap()}
}

function loadScript(src){return new Promise(r=>{const e=document.createElement('script');e.src=src;e.onload=e.onerror=r;document.head.append(e)})}
async function ensureLibs(){
  if(!window.L){
    for(const [css,js] of [['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'],['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js']]){
      const l=document.createElement('link');l.rel='stylesheet';l.href=css;document.head.append(l);await loadScript(js);if(window.L)break}
  }
  if(!window.Sortable)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js');
}
let errT=0;
window.addEventListener('error',e=>{if(Date.now()-errT<8000||!e.message||/Script error|ResizeObserver/.test(e.message))return;errT=Date.now();toast('うまく動かなかった操作があります。もう一度お試しください')});
window.addEventListener('unhandledrejection',()=>{});
load().then(ensureLibs).then(()=>{if(window.L&&$('.map-msg'))$('#map').innerHTML='';render();checkIncoming();live.boot();
  try{if(!localStorage.getItem('router-intro')&&!P().spots.length&&!location.hash)setTimeout(openIntro,400)}catch(_){}
  try{navigator.storage?.persist?.()}catch(_){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});setTimeout(recheckSpots,2500);
  {const q=new URLSearchParams(location.search);const t=[q.get('st'),q.get('sx'),q.get('su')].filter(Boolean).join('\n');
   if(t){history.replaceState(null,'',location.pathname);ui.tab='stock';render();quickAdd(t)}}setTimeout(autoPhotoAll,1500);
  try{if(localStorage.getItem('tabinote-geo'))startGeo(1)}catch(_){}
});
</script>
