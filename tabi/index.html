<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Router</title>
<meta name="apple-mobile-web-app-title" content="Router">
<meta name="application-name" content="Router">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
:root{
  --bg:#F6F5F2;--surface:#fff;--ink:#16181D;--sub:#80838C;--faint:#C3C5CB;--line:#ECEBE6;
  --acc:#FF5B3A;--acc-soft:#FFEEE9;--glass:rgba(255,255,255,.78);
  --sh:0 1px 2px rgba(20,20,30,.04),0 6px 20px rgba(20,20,30,.06);
  --sh2:0 10px 40px rgba(20,20,30,.16);
  --r:20px;--safe:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111214;--surface:#1B1C1F;--ink:#F2F2F3;--sub:#9A9DA5;--faint:#55585F;--line:#2A2B2F;
  --acc-soft:#3A2019;--glass:rgba(27,28,31,.8);--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme=dark]{--bg:#111214;--surface:#1B1C1F;--ink:#F2F2F3;--sub:#9A9DA5;--faint:#55585F;--line:#2A2B2F;--acc-soft:#3A2019;--glass:rgba(27,28,31,.8);--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg);overflow-x:hidden;overscroll-behavior-x:none}
body{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
.hscroll,.gantt,.carousel{touch-action:pan-x pan-y}
#pane-map,#map{touch-action:none}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
input,textarea,select{background:var(--bg);border:1px solid transparent;border-radius:14px;padding:11px 14px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
a{color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.leaflet-container svg{width:auto;height:auto;fill:initial;stroke:initial;stroke-width:initial;flex:initial}
.leaflet-control svg,.leaflet-marker-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:500;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.plan-btn{flex:1;min-width:0;text-align:left;display:block}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--sub)}
.plan-btn h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.plan-btn h1 svg{width:16px;height:16px;color:var(--sub)}
.plan-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh);flex:none;transition:transform .12s}
.ibtn:active{transform:scale(.92)}
.ibtn.flat{background:none;box-shadow:none}

/* ---------- layout ---------- */
.panes{padding:4px 16px calc(160px + var(--safe))}
.pane{display:none;animation:fade .25s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#pane-map{position:fixed;inset:0;z-index:1;padding:0}
#pane-map.on{display:block}
#map{position:absolute;inset:0;background:var(--line)}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--sub);font-size:14px;text-align:center;padding:24px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe));z-index:600;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh2);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);width:max-content;max-width:calc(100vw - 24px)}
.tab{display:flex;align-items:center;gap:4px;padding:10px 11px;white-space:nowrap;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);transition:all .2s}
.tab.on{background:var(--ink);color:var(--bg)}
.tab .cnt{font-size:10px;background:var(--acc);color:#fff;border-radius:999px;padding:0 6px;line-height:16px}

@media (max-width:380px){.top .ibtn{width:36px;height:36px}}
@media (min-width:1000px){
  .top{padding-left:28px;padding-right:28px;width:480px}
  .panes{width:480px;padding:4px 28px 120px}
  #pane-map{display:block!important;left:480px;top:0;border-left:1px solid var(--line)}
  .tab[data-tab="map"]{display:none}
  .tabbar{left:240px}
  .map-days{left:20px!important}
}

/* ---------- common ---------- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s,opacity .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.acc{background:var(--acc);color:#fff;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.block{width:100%}
.btn.danger{color:#E5484D}
.btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;transition:all .15s}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.hscroll::-webkit-scrollbar{display:none}
.kicker{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:800;font-size:15.5px;letter-spacing:-.01em;line-height:1.35;word-break:break-word}
.meta{font-size:12px;color:var(--sub)}
.sec-head{display:flex;align-items:center;gap:8px;margin:28px 0 12px}
.sec-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
.sec-head h2 span{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
.empty{text-align:center;padding:36px 20px;color:var(--sub);font-size:14px}
.empty .big{font-size:40px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* photo / placeholder */
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,hsl(var(--h) 70% 92%),hsl(calc(var(--h) + 40) 65% 86%));display:grid;place-items:center;flex:none}
@media (prefers-color-scheme:dark){.ph{background:linear-gradient(135deg,hsl(var(--h) 25% 22%),hsl(calc(var(--h) + 40) 25% 16%))}}
.ph>span{font-size:28px;filter:saturate(.9)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- schedule ---------- */
.days-row{margin-top:6px}
.day-chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);min-width:84px;transition:all .15s}
.day-chip small{font-size:10px;font-weight:800;letter-spacing:.12em;opacity:.6}
.day-chip b{font-size:13.5px;white-space:nowrap}
.day-chip.on{background:var(--ink);color:var(--bg);box-shadow:none}
.day-chip.add{justify-content:center;align-items:center;color:var(--acc);box-shadow:none;border:1.5px dashed color-mix(in srgb,var(--acc) 55%,transparent);background:transparent;flex-direction:row;gap:4px;font-weight:700;font-size:13px}
.day-set{display:flex;gap:8px;align-items:center;margin:12px 0 4px}
.day-set .pill:first-child input{width:132px}.day-set .pill input[type=time]{width:104px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--sub)}
.pill input{background:none;border:none;padding:4px 2px;width:auto;min-width:0;color:var(--ink);font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 20px;padding:14px 6px}
.summary div{text-align:center;border-left:1px solid var(--line)}
.summary div:first-child{border:none}
.summary small{display:block;font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.summary b{font-size:18px;font-weight:800}
.summary b em{font-style:normal;font-size:11px;font-weight:700;margin-left:1px}
.tl{position:relative}
.row-wrap{position:relative}
.stop{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:stretch}
.time{display:flex;flex-direction:column;align-items:flex-end;padding-top:10px}
.time b{font-size:16px;font-weight:800}
.time span{font-size:11.5px;color:var(--sub);font-weight:600}
.stop-card{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:8px;text-align:left;width:100%;transition:transform .15s}
.stop-card:active{transform:scale(.985)}
.thumb-wrap{position:relative;flex:none}
.th{width:80px;height:80px;border-radius:14px}
.idx{position:absolute;top:-6px;left:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--acc);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px var(--surface)}
.stop-card .info{flex:1;min-width:0;padding:2px 0}
.handle{padding:14px 6px;color:var(--faint);cursor:grab;touch-action:none;align-self:stretch;display:flex;align-items:center}
.leg{display:grid;grid-template-columns:50px 1fr;gap:10px;min-height:46px;align-items:center}
.leg-line{justify-self:end;margin-right:-26px;width:2px;height:100%;background:repeating-linear-gradient(to bottom,var(--faint) 0 4px,transparent 4px 9px)}
.leg-pill{justify-self:start;margin-left:18px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--sub);padding:5px 12px;border-radius:999px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);transition:all .15s}
.leg-pill:hover{color:var(--ink)}
.leg-pill b{color:var(--ink)}
.leg-pill .warn{color:#D97706}
.ghost{opacity:.35}
.sortable-chosen .stop-card{box-shadow:var(--sh2)}
.add-row{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 60px);margin:18px 0 0 60px;padding:14px;border-radius:var(--r);border:1.5px dashed var(--faint);color:var(--sub);font-weight:700;font-size:14px}
.add-row:hover{color:var(--acc);border-color:var(--acc)}
.end-mark{display:grid;grid-template-columns:50px 1fr;gap:10px;margin-top:14px;align-items:center}
.end-mark b{text-align:right;font-size:14px}
.end-mark span{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.08em}

/* ---------- stock ---------- */
.search-card{margin-top:6px;display:grid;gap:12px}
.search-card .ttl{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.field{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:14px;padding:0 4px 0 12px}
.field svg{color:var(--sub);width:18px;height:18px}
.field input{background:none;border:none;padding:12px 4px}
.field .ibtn{width:36px;height:36px;box-shadow:none;background:var(--surface)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.res-list{display:grid;gap:2px;margin:0 -6px}
.res{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:14px}
.res:hover{background:var(--bg)}
.res .ph{width:48px;height:48px;border-radius:12px}
.res .ph>span{font-size:20px}
.res .info{flex:1;min-width:0}
.res .name{font-size:14px}
.res-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);padding:4px 6px}
.state{font-size:13px;color:var(--sub);padding:10px 4px}
.state.err{color:#E5484D}
.ext{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.scard{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s}
.scard:active{transform:scale(.98)}
.scard .ph{width:100%;aspect-ratio:4/3}
.scard .sbody{padding:10px 12px 12px}
.scard .name{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);letter-spacing:.04em}
.add-fab{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--sh2);transition:transform .12s}
.add-fab:active{transform:scale(.9)}
.add-fab svg{width:18px;height:18px;stroke-width:2.4}
@media (min-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}

/* ---------- map overlays ---------- */
.map-days{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));left:16px;right:16px;z-index:400;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
@media (min-width:1000px){.map-days{top:20px}}
.map-days .chip{box-shadow:var(--sh)}
.carousel{position:absolute;left:0;right:0;bottom:calc(84px + var(--safe));z-index:400;display:flex;gap:10px;overflow-x:auto;padding:4px 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
@media (min-width:1000px){.carousel{bottom:20px}}
.carousel::-webkit-scrollbar{display:none}
.cc{flex:none;width:250px;scroll-snap-align:center;display:flex;gap:10px;align-items:center;padding:8px;border-radius:18px;background:var(--surface);box-shadow:var(--sh2);text-align:left;transition:outline .15s;outline:2px solid transparent}
.cc.hl{outline-color:var(--acc)}
.cc .ph{width:56px;height:56px;border-radius:12px}
.cc .ph>span{font-size:22px}
.cc .info{min-width:0;flex:1}
.cc .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:13px}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3.5px solid #8E939B;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:12px 14px;font:13px/1.5 inherit}
.leaflet-control-zoom{border:none!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-top{top:calc(64px + env(safe-area-inset-top,0px))}
@media (min-width:1000px){.leaflet-top{top:0}}

/* ---------- sheets ---------- */
.sheet-bg{position:fixed;inset:0;z-index:1000;background:rgba(12,12,18,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:bgIn .2s ease}
.sheet-bg.out{animation:bgOut .2s ease forwards}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + var(--safe));animation:up .28s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
.sheet.out{animation:down .2s ease forwards}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.sheet h3 span{flex:1}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:50%;transform:translate(-50%,50%);width:500px;border-radius:26px;max-height:86vh;animation:pop .25s cubic-bezier(.2,.9,.3,1)}.sheet.out{animation:popOut .18s ease forwards}.grabber{display:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,52%) scale(.96)}to{opacity:1;transform:translate(-50%,50%)}}
@keyframes popOut{to{opacity:0;transform:translate(-50%,52%) scale(.97)}}
@keyframes bgIn{from{opacity:0}}
@keyframes bgOut{to{opacity:0}}
.hero{margin:0 -18px 14px;height:220px;position:relative}
.hero .ph{width:100%;height:100%}
.hero .ph>span{font-size:64px}
.hero .chg{position:absolute;right:14px;bottom:14px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:none;color:var(--ink)}
@media (min-width:700px){.hero{margin-top:-8px;border-radius:26px 26px 0 0;overflow:hidden}}
.dname{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px;line-height:1.3}
.tline{display:flex;gap:16px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 14px;margin:12px 0}
.tline div small{display:block;font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.08em}
.tline div b{font-size:18px;font-weight:800}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:999px;padding:4px}
.stepper button{width:34px;height:34px;border-radius:50%;background:var(--surface);font-size:18px;font-weight:700;box-shadow:var(--sh)}
.stepper b{min-width:76px;text-align:center;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 6px;letter-spacing:.04em}
.mode-list{display:grid;gap:6px}
.mode{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);text-align:left;border:2px solid transparent}
.mode.on{border-color:var(--ink);background:var(--surface)}
.mode .e{font-size:22px}
.mode .n{flex:1;font-weight:700}
.mode .t{font-weight:800}
.mode .t small{font-weight:600;color:var(--sub);margin-left:6px}
.plan-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;width:100%;text-align:left}
.plan-item.on{background:var(--bg)}
.plan-item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:800}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.photo-grid button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg)}
.photo-grid img{width:100%;height:100%;object-fit:cover;display:block}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
#pickmap{height:200px;border-radius:16px;margin-top:8px}
.loc-res button{display:block;width:100%;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.sticky-foot{position:sticky;bottom:calc(-22px - var(--safe));margin:18px -18px calc(-22px - var(--safe));padding:12px 18px calc(16px + var(--safe));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.sticky-foot .btn{flex:1}
.note{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6}

/* 現在地・訪問記録 */
.me{width:18px;height:18px;border-radius:50%;background:#2F80ED;border:3px solid #fff;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,128,237,.5)}70%{box-shadow:0 0 0 16px rgba(47,128,237,0)}100%{box-shadow:0 0 0 0 rgba(47,128,237,0)}}
.ibtn.live{background:#2F80ED;color:#fff;animation:pulse 2.4s infinite}
.pin.done{background:#1F9D74}
.idx.done{background:#1F9D74}
.done-ov{position:absolute;inset:0;border-radius:14px;background:rgba(31,157,116,.5);display:grid;place-items:center;color:#fff}
.done-ov svg{width:34px;height:34px;stroke-width:3}
.stop-card.done{background:color-mix(in srgb,#1F9D74 7%,var(--surface))}
.visit{font-size:11.5px;font-weight:800;color:#1F9D74;margin-top:3px}
.here{font-size:11.5px;font-weight:800;color:#2F80ED;margin-top:3px}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:#2F80ED;border-radius:2px;transition:width .6s}
.stamp{position:absolute;right:38px;top:10px;transform:rotate(-10deg);font-size:10px!important;border:2.5px solid #1F9D74;color:#1F9D74;font-weight:900;font-size:12px;letter-spacing:.12em;padding:2px 8px;border-radius:8px;opacity:.85;pointer-events:none}
.pop .stamp{animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{opacity:0;transform:rotate(-10deg) scale(2.4)}100%{opacity:.85;transform:rotate(-10deg) scale(1)}}
.stop-card{position:relative}
.geo-bar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,#2F80ED 9%,var(--surface));font-size:12.5px;color:var(--ink)}
.geo-bar b{color:#2F80ED}
.geo-bar .btn{margin-left:auto}
.leaflet-bar a.loc-btn{display:grid;place-items:center;color:#16181D}
.leaflet-bar a.loc-btn.on{color:#2F80ED}
.leaflet-bar a.loc-btn svg{width:18px;height:18px}

/* 進捗：ゴーストレース＆ガント */
.race{margin-top:14px;padding:18px 16px 16px;overflow:hidden}
.race-status{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.race-status .emo{font-size:38px;line-height:1;animation:bob 1.6s ease-in-out infinite}
.race-status b{display:block;font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.race-status small{font-size:12.5px;color:var(--sub);font-weight:600}
.race-status.late b{color:#E5484D}.race-status.warn b{color:#D97706}.race-status.early b{color:#1F9D74}.race-status.ok b{color:var(--ink)}
.track{position:relative;height:96px;margin:14px 10px 4px}
.rail{position:absolute;left:0;right:0;top:62px;height:6px;border-radius:3px;background:var(--line)}
.fill{position:absolute;left:0;top:62px;height:6px;border-radius:3px;background:linear-gradient(90deg,#FFB199,var(--acc));transition:width 1s cubic-bezier(.3,.9,.3,1)}
.cp{z-index:3;position:absolute;top:59px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:2.5px solid var(--faint)}
.cp.done{background:#1F9D74;border-color:#1F9D74}
.flag{position:absolute;right:-10px;top:46px;font-size:20px}
.tok{position:absolute;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:left 1s cubic-bezier(.3,.9,.3,1)}
.tok .ic{font-size:26px;line-height:1}
.tok i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:999px;margin-top:2px;white-space:nowrap}
.ghost{opacity:.6;z-index:1;top:0;flex-direction:column-reverse}.ghost i{margin:0 0 2px}.ghost .ic{animation:float 2.2s ease-in-out infinite}.ghost i{background:var(--line);color:var(--sub)}
.runner{z-index:2}.runner .ic{transform:scaleX(-1);animation:run .5s ease-in-out infinite alternate}.runner i{background:var(--acc);color:#fff}
.runner.stop .ic{animation:none}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes run{to{transform:scaleX(-1) translateY(-4px) rotate(4deg)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
.gap-tag{position:absolute;top:74px;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--sub);white-space:nowrap}
.race-foot{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.race-foot b{color:var(--ink)}
.recover{margin-top:12px;width:100%;justify-content:flex-start;text-align:left;white-space:normal;background:color-mix(in srgb,#E5484D 8%,var(--surface));box-shadow:none;color:var(--ink);font-size:13px;border-radius:16px;padding:12px 14px}
.gantt-card{margin-top:14px;padding:14px 0 10px}
.gantt-card .ttl{display:flex;align-items:center;gap:8px;padding:0 16px 8px;font-weight:800}
.gantt-card .ttl span{flex:1}
.lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);font-weight:600}
.lg i{display:inline-block;width:14px;height:6px;border-radius:3px}
.gantt{overflow-x:auto;position:relative;scrollbar-width:thin}
.g-in{position:relative;padding:22px 0 6px}
.g-axis{position:absolute;top:0;left:0;right:0;height:100%;pointer-events:none}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-tick span{position:absolute;top:2px;left:4px;font-size:10.5px;color:var(--sub);font-weight:700}
.g-day{position:absolute;top:0;bottom:0;border-left:2px solid var(--faint)}
.g-row{position:relative;height:50px}
.g-bar{cursor:pointer;position:absolute;top:8px;height:24px;border-radius:8px;background:var(--acc-soft);color:var(--ink);font-size:11.5px;font-weight:700;display:flex;align-items:center;gap:5px;padding:0 8px;white-space:nowrap;overflow:hidden;min-width:26px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent)}
.g-bar b{flex:none;width:17px;height:17px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;display:grid;place-items:center}
.g-bar.done{background:color-mix(in srgb,#1F9D74 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,#1F9D74 40%,transparent)}
.g-bar.done b{background:#1F9D74}
.g-bar.cur{box-shadow:inset 0 0 0 2px #2F80ED}
.g-bar.miss{opacity:.55;text-decoration:line-through}
.g-act{position:absolute;top:36px;height:6px;border-radius:3px;background:#1F9D74;min-width:4px}
.g-act.live{background:#2F80ED;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.45}}
.g-leg{position:absolute;top:19px;height:2px;background:repeating-linear-gradient(90deg,var(--faint) 0 4px,transparent 4px 7px)}
.g-leg span{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:12px}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:#E5484D;z-index:3}
.g-now span{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#E5484D;color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;white-space:nowrap}
.g-now::after{content:"";position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:#E5484D;animation:pulse 2s infinite}

/* ピンくん */
.empty .pk{display:block;margin:0 auto 10px;animation:pkbob 2.4s ease-in-out infinite}
@keyframes pkbob{50%{transform:translateY(-6px)}}
.runner .ic.pkw{transform:none;animation:pkhop .45s ease-in-out infinite alternate;line-height:0}
.runner.stop .ic.pkw{animation:none}
@keyframes pkhop{to{transform:translateY(-5px) rotate(5deg)}}
.cele{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:bgIn .2s ease}
.cele.out{animation:bgOut .3s ease forwards}
.cele-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);padding:22px 28px 20px;border-radius:28px;box-shadow:var(--sh2);animation:celePop .5s cubic-bezier(.2,1.6,.4,1)}
.cele-in .pk{animation:pkjump .6s cubic-bezier(.3,1.6,.5,1) 2}
.cele-in b{font-size:26px;font-weight:900;letter-spacing:.08em;color:#1F9D74;margin-top:4px}
.cele-in span{font-size:13px;color:var(--sub);font-weight:600;text-align:center;max-width:240px}
@keyframes celePop{from{transform:scale(.6);opacity:0}}
@keyframes pkjump{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}100%{transform:translateY(0)}}
.conf{position:absolute;left:50%;top:42%;width:0;height:0;pointer-events:none}
.conf i{position:absolute;width:9px;height:14px;border-radius:2px;background:var(--ink);opacity:0;animation:boom 1.2s cubic-bezier(.2,.8,.3,1) var(--d) forwards}
.conf i:nth-child(3n){background:#1F9D74}.conf i:nth-child(3n+1){background:var(--faint);border-radius:50%;width:10px;height:10px}
@keyframes boom{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 80px)) rotate(var(--r))}}

/* 追加カード */
.step{display:flex;gap:12px;align-items:flex-start}
.step .no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.step .sb2{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.step .sb2>b{font-size:14.5px}
.step .hscroll{margin:0 -16px 0 -52px;padding-left:52px}
.confirm{border-radius:18px;padding:12px;background:var(--bg);animation:fade .25s ease}
.confirm{display:grid;grid-template-columns:minmax(0,1fr)}.confirm input{background:var(--surface);min-width:0}
.confirm .field{background:var(--surface)}
.cth{width:48px;height:48px;border-radius:12px;flex:none}.cth>span{font-size:22px}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{font-size:12.5px;color:var(--sub);font-weight:700;cursor:pointer;list-style:none}
details.more summary::before{content:"＋ "}details.more[open] summary::before{content:"－ "}

/* クイックバー */
.quick{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + var(--safe));z-index:590;display:none;gap:6px;align-items:center;padding:5px;border-radius:999px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--sh2);width:max-content;max-width:calc(100vw - 24px);animation:fade .25s ease}
.quick.on{display:flex}
.qbtn{padding:10px 14px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.qbtn.pri{background:var(--acc);color:#fff;box-shadow:none}
.qx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}.qx svg{width:16px;height:16px}
@media (min-width:1000px){.quick{left:240px}}
.toast{bottom:calc(136px + var(--safe))!important}

/* 候補リスト */
.add-bar{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-top:6px;padding:14px 16px}
.add-bar b{font-size:14.5px}.add-bar .meta{flex:1}.add-bar .chev{font-size:20px;font-weight:700;color:var(--acc)}
.add-close{display:flex;justify-content:flex-end;margin:6px 0 -2px}
.filters{display:grid;gap:8px;margin-bottom:6px}
.filters .field{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.filters .seg{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.filters .seg button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.sort{width:auto;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700}
.chip small{font-size:10.5px;opacity:.6;margin-left:2px}
.linkbtn{color:var(--acc);font-weight:700;font-size:12px;text-decoration:underline}
.slist{padding:4px 0;overflow:hidden}
.sgroup{font-size:11.5px;font-weight:800;color:var(--sub);padding:12px 14px 4px;letter-spacing:.04em}
.srow{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;border-top:1px solid var(--line);cursor:pointer}
.slist .srow:first-child,.sgroup+.srow{border-top:none}
.srow:active{background:var(--bg)}
.sth{width:48px;height:48px;border-radius:12px}.sth>span{font-size:22px}
.srow .info{flex:1;min-width:0}
.srow .name{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubadge{flex:none;font-size:10.5px;font-weight:800;color:#1F9D74;background:color-mix(in srgb,#1F9D74 12%,var(--surface));padding:3px 7px;border-radius:999px}
.addbtn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.addbtn svg{width:16px;height:16px;stroke-width:2.6}

.locrow{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12.5px;font-weight:600;background:var(--bg);border-radius:14px;padding:8px 8px 8px 12px}
.locrow.warn{background:color-mix(in srgb,#D97706 12%,var(--surface));color:#9A5B00}
@media (prefers-color-scheme:dark){.locrow.warn{color:#F5B451}}
.search-card>.seg button.on{background:var(--ink);color:var(--bg)}

.welcome{position:fixed;left:12px;right:12px;bottom:calc(150px + var(--safe));z-index:1500;background:var(--surface);border-radius:22px;box-shadow:var(--sh2);padding:14px;display:grid;gap:10px;animation:celePop .4s cubic-bezier(.2,1.4,.4,1);max-width:440px;margin:0 auto}
.wl-in{display:flex;align-items:center;gap:12px}.wl-in b{display:block;font-size:16px}.wl-in span{font-size:13px;color:var(--sub)}

.rec{font-size:10px;font-weight:800;color:#fff;background:#1F9D74;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:2px}
.geo-bar .qx{flex:none}
.intro{text-align:center;padding:10px 6px 0}
.intro .pk{margin:0 auto}
.intro p{color:var(--sub);font-size:14px;line-height:1.8;margin:0 0 6px}
.intro p b{color:var(--ink)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all .2s}.dots i.on{width:18px;background:var(--ink)}

/* シートの下部ボタンを常に表示 */
.sheet{display:flex;flex-direction:column;overflow:hidden;padding:8px 0 0}
.sheet>.grabber{flex:none}
.sheet .sb{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 18px 18px}
.sheet>.sticky-foot{position:static;margin:0;flex:none;padding:12px 18px calc(12px + var(--safe));border-top:1px solid var(--line);background:var(--surface)}
@media (min-width:700px){.sheet>.sticky-foot{border-radius:0 0 26px 26px}}
.sheet h3{position:sticky;top:0;background:var(--surface);z-index:2;margin:0 -18px 10px;padding:8px 18px 6px}
/* 追加パネル */
.src2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.src{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;background:var(--bg);text-align:left;transition:transform .12s}
.src:active{transform:scale(.97)}
.src .se{font-size:24px}.src b{font-size:15px}.src small{font-size:11.5px;color:var(--sub);font-weight:600}
.src:first-child{background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
.howto{font-size:12.5px;color:var(--sub);line-height:1.7;text-align:center}
.howto b{color:var(--ink)}
/* 日の切り替えアニメーション */
.pane.slide-l,.carousel.slide-l{animation:slL .22s cubic-bezier(.2,.8,.3,1)}.pane.slide-r,.carousel.slide-r{animation:slR .22s cubic-bezier(.2,.8,.3,1)}
@keyframes slL{from{opacity:.4;transform:translateX(40px)}}@keyframes slR{from{opacity:.4;transform:translateX(-40px)}}
/* 終了時刻 */
.endnote{display:block;font-style:normal;font-size:10px!important;font-weight:800;color:#1F9D74;margin-top:1px}
.endnote.over{color:#E5484D}
.day-set{flex-wrap:wrap}
/* ペース表示（シンプル） */
.race-status .sdot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ink);margin:0 2px}
.race-status.late .sdot{background:#E5484D}.race-status.warn .sdot{background:#D97706}.race-status.early .sdot{background:#1F9D74}
.goal{position:absolute;right:-2px;top:52px;width:4px;height:26px;border-radius:2px;background:var(--ink)}
.pmark{position:absolute;top:44px;width:2px;height:42px;margin-left:-1px;background:var(--faint)}
.pmark i,.ymark i{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;white-space:nowrap;color:var(--sub)}
.ymark{position:absolute;top:56px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:4px solid var(--acc);box-shadow:var(--sh);transition:left 1s cubic-bezier(.3,.9,.3,1)}
.ymark i{top:24px;color:var(--acc)}
/* 地図：おおよその位置 */
.pin.approx{background:var(--surface);border:2.5px dashed var(--acc)}.pin.approx span{color:var(--acc)}
/* トラベルキット */
#kitBtn.on{background:var(--ink);color:var(--bg)}
.kit{margin-bottom:14px}
.ktl{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:10px}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--bg);text-decoration:none;color:inherit;text-align:center}
.qa span{font-size:22px}.qa b{font-size:12px}.qa small{font-size:9.5px;color:var(--sub);line-height:1.3}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--bg)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .lb{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 6px;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .ct{position:absolute;top:6px;left:6px;font-size:9.5px;font-weight:800;background:var(--glass);color:var(--ink);border-radius:999px;padding:1px 6px}
.shotv{margin:0 -18px;background:#000;display:grid;place-items:center;max-height:60vh;overflow:auto}
.shotv img{max-width:100%;max-height:60vh;display:block}
.sos{display:grid;gap:6px}
.sosr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg);text-decoration:none;color:inherit}
.sosr .se{font-size:20px}.sosr .sn{flex:1;font-size:13.5px;font-weight:700}.sosr b{font-size:16px;font-weight:900}
.sosr a{text-decoration:none;color:inherit}
.sosr.hot{background:color-mix(in srgb,#E5484D 12%,var(--surface))}.sosr.hot b{color:#E5484D}
.near{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:6px}.near b{font-size:13.5px}

.shot .sh{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:800;background:#1F9D74;color:#fff;border-radius:999px;padding:1px 6px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot .sh.lock{background:var(--glass);color:var(--ink)}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--bg);font-size:13px}
.shrow small{color:var(--sub);font-size:11.5px}

/* プラン一覧（ホーム） */
body.at-home .top,body.at-home .tabbar,body.at-home .quick{display:none!important}
body.at-home #pane-map{display:none!important}
.home-top{display:flex;align-items:center;gap:8px;padding-top:calc(14px + env(safe-area-inset-top,0px));font-weight:900;letter-spacing:.14em;font-size:12px;color:var(--sub)}
.home-top img{width:26px;height:26px;border-radius:7px}
.home-h{font-size:32px;font-weight:900;letter-spacing:-.03em;margin:18px 0 16px}
.plist{display:grid;gap:10px}
.pcard{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--sh);cursor:pointer;transition:transform .12s}

// 位置の特定：まずエリアの中心を求め、その周辺（約8km以内）に限定して店名を探す。
// 見つからなければ遠くの同名店を採用せず、エリアの中心を「おおよその位置」にする。
async function searchNear(name,center,km){
  const out=[];
  const vb=center?`&viewbox=${center.lng-.08},${center.lat+.07},${center.lng+.08},${center.lat-.07}&bounded=1`:'';
  try{(await getJSON(`https://nominatim.openstreetmap.org/search?format=json&limit=8&countrycodes=jp&accept-language=ja${vb}&q=${encodeURIComponent(name)}`,10000)).forEach(x=>out.push({name:x.display_name,lat:+x.lat,lng:+x.lon}))}catch(_){}
  try{(await getJSON(`https://photon.komoot.io/api/?limit=8&bbox=122,24,154,46${center?`&lat=${center.lat}&lon=${center.lng}`:''}&q=${encodeURIComponent(name)}`,10000)).features.forEach(f=>{const p=f.properties;out.push({name:[p.name,p.street,p.district||p.city,p.state].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],nm:p.name})})}catch(_){}
  const n=norm(name.replace(/\s.*$/,''));
  return out.map(x=>({...x,d:center?dist(center,x):0,match:norm(x.nm||x.name.split(',')[0]).includes(n)}))
    .filter(x=>!center||x.d<=km).sort((a,b)=>(b.match-a.match)||(a.d-b.d));
}

async function geocode(q){

    if(j.length){const [lng,lat]=j[0].geometry.coordinates;return {lat,lng}}}catch(_){}
  try{const j=await getJSON(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&accept-language=ja&q=${encodeURIComponent(q)}`,10000);
    if(j.length)return {lat:+j[0].lat,lng:+j[0].lon}}catch(_){}
  throw new Error(`「${q}」の場所を特定できませんでした。駅名や住所で入力し直すか、現在地ボタンをお試しください。`);
}
async function overpass(q){

const b64u={enc:u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec:t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');const s=atob(t);return Uint8Array.from(s,c=>c.charCodeAt(0))}};
async function pack(p){
  const x=JSON.parse(JSON.stringify(p));x.spots.forEach(s=>{if(String(s.photo||'').startsWith('data:'))delete s.photo;delete s.pt});
  const raw=new TextEncoder().encode(JSON.stringify(x));
  if(window.CompressionStream){const buf=await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return 'z'+b64u.enc(new Uint8Array(buf))}
  return 'j'+b64u.enc(raw);
}
async function unpack(t){
  const bytes=b64u.dec(t.slice(1));
  if(t[0]==='z'){const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();return JSON.parse(new TextDecoder().decode(buf))}
  return JSON.parse(new TextDecoder().decode(bytes));
}

async function shrink(dataURL,max=1200,q=.8){const img=new Image();img.src=dataURL;await img.decode();const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

  p.shared=(p.shared||[]).filter(y=>y.id!==x.id);

      p.shared.push({id:x.id,label:x.label||'',cat:x.cat,by:fb.uid,name:db.me||''});x.shared=true;toast('この画像をグループに共有しました')}

let pulling=false;
async function pullShared(){
  const p=P();if(pulling||!p.gid)return;
  if(!(p.shared||[]).length&&!shots.some(x=>x.remote&&x.plan===p.id))return;pulling=true;
  p.shared=p.shared||[];
  try{const fb=await live.init();
    const want=new Set(p.shared.map(x=>x.id));
    // 共有が取り消された他人の画像は消す
    const before=shots.length;shots=shots.filter(x=>!(x.remote&&x.plan===p.id&&!want.has(x.id)));let changed=before!==shots.length;
    for(const it of p.shared){if(shots.some(x=>x.id===it.id)||(ui.hideShots||[]).includes(it.id))continue;
      const d=await fb.get(shotDoc(p.gid,it.id)).catch(()=>null);if(!d?.data)continue;
      const v=JSON.parse(d.data);shots.push({id:it.id,plan:p.id,cat:v.cat,label:v.label,data:v.img,at:d.u,remote:true,owner:it.name||'メンバー'});changed=true}
    if(changed){await saveShots();renderKit()}
  }catch(_){}finally{pulling=false}
}

// money = {mem:[{id,n}], items:[{id,t,sid,day,amt,payer,who:[],mode:'eq'|'tilt'|'treat'|'fix',w:{},fix:{},at}], unit, done:{}}
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
function M(){const p=P();if(!p.money)p.money={mem:[],items:[],unit:100,done:{}};const m=p.money;
  if(!m.mem.length){const g=Object.values(p.members||{}).map(x=>x.n).filter(Boolean);(g.length?g:[db.me||'自分']).forEach(n=>m.mem.push({id:uid(),n}))}
  m.done=m.done||{};m.unit=m.unit??100;return m}
const memName=id=>M().mem.find(x=>x.id===id)?.n||'？';
const TILT=[[.5,'少なめ'],[1,'普通'],[1.5,'多め'],[2,'かなり多め']];
// 1件の支払いを、各メンバーの負担額に分ける
function shares(it){
  const who=it.mode==='treat'?[it.payer]:(it.who||[]).filter(id=>M().mem.some(x=>x.id===id)),r={};if(!who.length)return r;
  if(it.mode==='fix'){let rest=it.amt;const free=[];who.forEach(id=>{const v=+(it.fix||{})[id];if(v>0){r[id]=v;rest-=v}else free.push(id)});
    if(free.length)free.forEach(id=>r[id]=(r[id]||0)+rest/free.length);else if(rest)r[it.payer]=(r[it.payer]||0)+rest;return r}
  const w=id=>it.mode==='tilt'?+((it.w||{})[id]??1):1,tw=who.reduce((a,id)=>a+w(id),0);who.forEach(id=>r[id]=it.amt*w(id)/tw);return r;
}
function balances(){const m=M(),b={};m.mem.forEach(x=>b[x.id]={paid:0,owe:0});
  m.items.forEach(it=>{if(b[it.payer])b[it.payer].paid+=it.amt;const sh=shares(it);Object.entries(sh).forEach(([id,v])=>{if(b[id])b[id].owe+=v})});return b}
// 精算：送金回数が少なくなるように、多く払った人へまとめて送る
function settle(){const m=M(),b=balances(),u=+m.unit||1;
  const cr=[],dr=[];Object.entries(b).forEach(([id,x])=>{const d=x.paid-x.owe;if(d>.5)cr.push({id,v:d});else if(d<-.5)dr.push({id,v:-d})});
  cr.sort((a,b)=>b.v-a.v);dr.sort((a,b)=>b.v-a.v);const out=[];
  let i=0,j=0;while(i<dr.length&&j<cr.length){const v=Math.min(dr[i].v,cr[j].v);out.push({from:dr[i].id,to:cr[j].id,v:Math.ceil(v/u-1e-9)*u,raw:v});dr[i].v-=v;cr[j].v-=v;if(dr[i].v<.5)i++;if(cr[j].v<.5)j++}
  return out.filter(x=>x.v>0);
}

  shareFromMenu:()=>{closeSheet();setTimeout(()=>openSheet(shareHTML),220)},
  formLocOpen:()=>openURL(`https://www.google.com/maps/search/${encodeURIComponent(((document.querySelector('[data-f="d.name"]')?.value||draft.name||'')+' '+(draft.area||'')).trim())}`),
  formLocPaste:async()=>{let t='';try{t=await navigator.clipboard.readText()}catch(_){}if(!t)return toast('Googleマップで「共有」→「コピー」してから押してください');
    let r=parsePaste(t);if(!r)return;toast('位置を読み取っています…');r=await enrich(r);
    if(hasLL(r)&&!r.approx){setLL(r.lat,r.lng);pickMap&&pickMap.setView([r.lat,r.lng],16);if(!draft.name&&r.name){draft.name=r.name;const n=document.querySelector('[data-f="d.name"]');if(n)n.value=r.name}toast('位置を設定しました')}
    else toast('このリンクから位置を読み取れませんでした',()=>openSheet(diagHTML),'理由を見る')},
  diag:()=>openSheet(diagHTML),
  diagCopy:async()=>{try{await navigator.clipboard.writeText(DIAG.join('\n'));toast('記録をコピーしました')}catch(_){toast('コピーできませんでした')}},
  diagClear:()=>{DIAG=[];try{localStorage.removeItem('router-diag')}catch(_){}refreshSheet()},
  mapApp:()=>{SET.mapKind='app';saveSet();gmapSrc='';render();toast('アプリ内の地図に切り替えました（設定でGoogleマップに戻せます）')},
  mapGoogle:()=>{SET.mapKind='google';saveSet();render()},
  locFind:el=>{const s=S(el.dataset.sid);ui.fixSid=s.id;ui.fixAt=Date.now();saveUI();openURL(`https://www.google.com/maps/search/${encodeURIComponent((s.name+' '+(s.area||'')).trim())}`)},
  locFixPaste:async el=>{const sid=el?.dataset?.sid||ui.fixSid;document.querySelector('.welcome')?.remove();
    try{const t=await navigator.clipboard.readText();if(!t)throw 0;fixLoc(sid,t)}catch(_){toast('コピーした内容を読み取れませんでした。もう一度「コピー」してからお試しください')}},
  payClearAsk:()=>openSheet(payClearHTML),
  payClear:el=>{const sn=snap(),m=M(),v=el.dataset.v,before=m.items.length;
    m.items=v==='day'?m.items.filter(x=>(x.day??0)!==ui.day):[];m.done={};save();closeSheet();render();
    toast(`${before-m.items.length}件の支払いを削除しました`,restore(sn))},
  epPick:el=>{epKey=el.dataset.k;ui.epQ='';openSheet(epHTML)},
  epSet:el=>{const id=el.dataset.id||null,p=P(),d=D(),i=ui.day,k=epKey;const msg=[];
    if(k==='hotel'){d.hotel=id;if(id){if(!d.to){d.to=id;msg.push('この日の終着地点')}const nx=p.days[i+1];if(nx&&!nx.from){nx.from=id;msg.push(`DAY ${i+2} の出発地点`)}}}
    else{d[k]=id;delete d[k+'Mode']}
    save();closeSheet();render();toast(id?(msg.length?`${S(id).name} を宿泊先にし、${msg.join('と')}にも設定しました`:`${EPL[k][1]}を設定しました`):'設定を外しました')},
  epNew:()=>{closeSheet();setTimeout(()=>openForm(),220)},
  payAdd:()=>openPay(),
  payFromSpot:el=>{closeSheet();ui.tab='money';render();setTimeout(()=>openPay(null,el.dataset.sid),220)},
  payEdit:el=>openPay(M().items.find(x=>x.id===el.dataset.id)),
  paySpot:el=>{pay.sid=el.dataset.sid;pay.t='';refreshSheet()},
  payFree:()=>{pay.sid=null;refreshSheet();setTimeout(()=>$('#payT')?.focus(),50)},
  payPayer:el=>{pay.payer=el.dataset.id;refreshSheet()},
  payMode:el=>{pay.mode=el.dataset.v;refreshSheet()},
  payWho:el=>{const id=el.dataset.id,w=new Set(pay.who||[]);w.has(id)?w.delete(id):w.add(id);pay.who=[...w];refreshSheet()},
  paySave:()=>{const x=pay;x.amt=Math.round(+x.amt||0);if(!x.amt)return toast('金額を入力してください');if(x.mode!=='treat'&&!(x.who||[]).length)return toast('割る人を選んでください');
    const m=M(),isNew=x._new;delete x._new;x.at=x.at||Date.now();const i=m.items.findIndex(y=>y.id===x.id);if(i>=0)m.items[i]=x;else m.items.push(x);m.done={};save();closeSheet();render();toast(isNew?`${yen(x.amt)} を記録しました`:'保存しました')},
  payDel:()=>{const sn=snap(),m=M();m.items=m.items.filter(y=>y.id!==pay.id);m.done={};save();closeSheet();render();toast('支払いを削除しました',restore(sn))},
  unit:el=>{M().unit=+el.dataset.v;save();renderMoney()},
  trDone:el=>{const m=M(),k=el.dataset.k;m.done[k]=!m.done[k];save();renderMoney()},
  payShare:async()=>{const t=moneyText();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(t);toast('精算結果をコピーしました')}catch(_){toast('共有できませんでした')}},
  memAdd:()=>{memEdit=null;openSheet(memHTML);setTimeout(()=>$('#memName')?.focus(),300)},
  memEdit:el=>{memEdit=el.dataset.id;openSheet(memHTML)},
  memSave:()=>{const n=($('#memName')?.value||'').trim();if(!n)return toast('名前を入力してください');const m=M();
    if(memEdit){m.mem.find(x=>x.id===memEdit).n=n}else{const id=uid();m.mem.push({id,n});m.items.forEach(it=>{if(it.mode==='eq'&&(it.who||[]).length===m.mem.length-1)it.who.push(id)})}save();closeSheet();render()},
  memDel:()=>{const m=M();if(m.items.some(it=>it.payer===memEdit))return toast('支払いをした人は削除できません');const sn=snap();m.mem=m.mem.filter(x=>x.id!==memEdit);m.items.forEach(it=>{it.who=(it.who||[]).filter(id=>id!==memEdit)});m.done={};save();closeSheet();render();toast('メンバーを削除しました',restore(sn))},
  settings:()=>openSheet(setHTML),
  setTog:el=>{const k=el.dataset.k;SET[k]=!SET[k];saveSet();refreshSheet();if(k==='geoTip'&&SET[k])ui.geoHide=0;render()},
  setVal:el=>{const k=el.dataset.k,v=el.dataset.v;SET[k]=isNaN(+v)?v:+v;saveSet();refreshSheet();render()},
  recap:async()=>{const t=recapText();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(t);toast('ふりかえりをコピーしました')}catch(_){toast('共有できませんでした')}},
  openPlan:(el,e)=>{if(e.target.closest('[data-act=planMore]'))return;db.cur=el.dataset.id;ui.day=0;fitKey='';ui.tab='plan';save(false);render();scrollTo({top:0});setTimeout(autoPhotoAll,500)},
  planMore:el=>{db.cur=el.dataset.id;save(false);openSheet(planHTML)},
  homeNew:()=>{openSheet(newPlanHTML);setTimeout(()=>$('#npTitle')?.focus(),300)},
  npOk:()=>{const t=($('#npTitle')?.value||'').trim(),d=$('#npDate')?.value||'';const p=mkPlan(t||'新しいプラン');p.days[0].date=d;db.plans.push(p);db.cur=p.id;ui.day=0;ui.tab='stock';ui.addOpen=true;fitKey='';save();closeSheet();render();scrollTo({top:0});toast('プランを作成しました。行きたい場所を追加しましょう')},
  goHome:()=>{ui.tab='home';render();scrollTo({top:0})},
  shotShare:()=>{const x=shots.find(y=>y.id===shotView);if(x&&!x.remote)shareShot(x,!x.shared)},
  kCat:el=>{ui.kCat=el.dataset.v;renderKit()},
  shotAdd:()=>$('#fileShot').click(),
  shotOpen:el=>{shotView=el.dataset.id;openSheet(shotHTML)},
  shotSave:async()=>{const x=shots.find(y=>y.id===shotView);if(!x)return;x.label=($('#shotLabel')?.value||'').trim();await saveShots();if(x.shared)await shareShot(x,true);renderKit();document.activeElement?.blur();toast('ラベルを保存しました')},
  shotCat:async el=>{const x=shots.find(y=>y.id===shotView);if(!x)return;x.cat=el.dataset.v;await saveShots();renderKit();refreshSheet()},
  shotDel:async()=>{const i=shots.findIndex(y=>y.id===shotView);if(i<0)return;if(shots[i].remote){const id=shots[i].id;ui.hideShots=[...(ui.hideShots||[]),id]}if(shots[i].shared)await shareShot(shots[i],false);const [x]=shots.splice(i,1);await saveShots();closeSheet();renderKit();toast('画像を削除しました',async()=>{shots.push(x);await saveShots();renderKit()})},
  ctAdd:()=>{openSheet(ctHTML);setTimeout(()=>$('#ctName')?.focus(),300)},
  ctSave:()=>{const n=($('#ctName')?.value||'').trim(),t=($('#ctTel')?.value||'').trim();if(!n||!t)return toast('名前と電話番号を入力してください');const p=P();(p.contacts=p.contacts||[]).push({name:n,tel:t});save();closeSheet();renderKit();toast('連絡先を追加しました')},
  ctDel:el=>{const sn=snap(),p=P();p.contacts.splice(+el.dataset.i,1);save();renderKit();toast('連絡先を削除しました',restore(sn))},
  titleOk:()=>{const v=($('#titleIn')?.value||'').trim();P().title=v||'無題のプラン';save();render();document.activeElement?.blur();toast('プラン名を保存しました');refreshSheet()},
  meOk:()=>{db.me=($('#meIn')?.value||'').trim().slice(0,20);save(false);db.plans.filter(x=>x.gid).forEach(x=>live.me(x));document.activeElement?.blur();toast('表示名を保存しました')},
  delSpotD:el=>{const sn=detail?.snap||snap(),p=P(),id=el.dataset.sid,n=S(id)?.name;p.spots=p.spots.filter(x=>x.id!==id);p.days.forEach(d=>{d.items=d.items.filter(i=>i.spot!==id);['from','to','hotel'].forEach(k=>{if(d[k]===id)d[k]=null})});
    if(detail)detail.snap=null;save();closeSheet();render();toast(`「${n}」を削除しました`,restore(sn))},
  setGenre:el=>{const s=S(detail.sid);if(!s)return;const prev=gOf(s.genre).stay;s.genre=el.dataset.g;if(+s.stay===prev)s.stay=gOf(s.genre).stay;save();refreshSheet();render()},
  install:async()=>{if(!installEvt)return toast('ブラウザのメニューから「アプリをインストール」を選んでください');installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;renderStock();if(r.outcome==='accepted')toast('インストールしました！共有メニューに Router が出ます')},
  geoHide:()=>{ui.geoHide=1;saveUI();render();toast('右上の📍ボタンからいつでもONにできます')},
  help:()=>{closeSheet();setTimeout(()=>openIntro(),220)},
  introNext:()=>{ui.introStep=(ui.introStep||0)+1;if(ui.introStep>=INTRO.length){closeSheet();localStorage.setItem('router-intro','1')}else refreshSheet()},
  introSkip:()=>{closeSheet();try{localStorage.setItem('router-intro','1')}catch(_){}},
  wlClose:()=>document.querySelector('.welcome')?.remove(),
  addMode:el=>{ui.addMode=el.dataset.v;if(ui.addMode==='spot'&&FOODK.includes(ui.fGenre))ui.fGenre='観光';if(ui.addMode==='food'&&!FOODK.includes(ui.fGenre))ui.fGenre='グルメ';ui.fRes=null;ui.fState='';renderStock()},
  spotSearch:()=>spotSearch(),
  spotAdd:el=>{const x=ui.sres[+el.dataset.i],p=P();if(p.spots.some(s=>s.name===x.nm))return;
    const sp={id:uid(),name:x.nm,area:x.area,genre:x.genre,stay:gOf(x.genre).stay,lat:x.lat,lng:x.lng,memo:''};p.spots.push(sp);save();render();autoPhoto(sp);toast(`「${sp.name}」を候補に追加しました`)},
  addToggle:()=>{ui.addOpen=!(ui.addOpen??!P().spots.length);renderStock()},
  f2clear:()=>{ui.fArea2=ui.fGenre2=ui.st2=ui.q2='';renderStock()},
  extAgain:()=>openURL(ui.lastExt),
  quickPaste:async()=>{document.querySelector('.welcome')?.remove();try{const t=await navigator.clipboard.readText();if(!t)throw 0;lastClip=t;ui.fixSid=null;saveUI();quickAdd(t)}catch(_){ui.tab='stock';render();toast('下の入力欄を長押しして「ペースト」してください');setTimeout(()=>{$('#pasteIn')?.scrollIntoView({block:'center'});$('#pasteIn')?.focus()},100)}},
  quickClose:()=>{ui.lastExt='';saveUI();renderQuick()},
  openTabelog:()=>openExt('tabelog'),
  openGmaps:()=>openExt('gmaps'),
  pasteClip:async()=>{try{const t=await navigator.clipboard.readText();if(!t)throw 0;quickAdd(t)}catch(_){toast('入力欄を長押しして「ペースト」してください');$('#pasteIn')?.focus()}},
  pstGenre:el=>{ui.pst.genre=el.dataset.g;document.querySelectorAll('[data-act=pstGenre]').forEach(c=>c.classList.toggle('on',c.dataset.g===ui.pst.genre))},
  pstCancel:()=>{ui.pst=null;renderStock()},
  pstAdd:el=>addFromPaste(!!el.dataset.day),
  liveStart:()=>live.start(),
  liveInvite:()=>live.invite(),
  liveLeave:()=>live.leave(),
  liveJoin:()=>joinNow(),
  geo:()=>GEO.watch!=null?stopGeo():startGeo(),
  locate:()=>{if(GEO.watch==null){GEO.fly=1;startGeo()}else if(GEO.pos&&MAP)MAP.flyTo([GEO.pos.lat,GEO.pos.lng],16,{duration:.6});else{GEO.fly=1;toast('現在地を取得中…')}},
  visit:el=>{const it=D().items[+el.dataset.i];if(it.v)delete it.v;else{it.v={a:Date.now(),d:Date.now(),m:1};GEO.justDone=it.id;setTimeout(()=>GEO.justDone=null,1500);celebrate(S(it.spot).name)}save();render();refreshSheet()},
  tab:el=>{ui.tab=el.dataset.tab;if(ui.tab==='prog'){const t=new Date().toLocaleDateString('sv-SE'),i=P().days.findIndex(d=>d.date===t);if(i>=0)ui.day=i;ui.gScroll=1}render();scrollTo({top:0})},
  recover:el=>{const sn=snap(),it=D().items[+el.dataset.i],s=S(it.spot),m=+el.dataset.m;s.stay=Math.max(0,(+s.stay||0)-m);save();render();toast(`「${s.name}」の滞在を${m}分短縮しました`,restore(sn))},
  progDate:()=>{const d=D();d.date=new Date().toLocaleDateString('sv-SE');save();render()},
  day:el=>{ui.day=+el.dataset.i;ui.hl=null;render()},
  addDay:()=>{const p=P(),l=p.days.at(-1);p.days.push({date:addDays(l.date,1),start:l.start||'09:00',items:[]});ui.day=p.days.length-1;save();render();toast(`DAY ${p.days.length} を追加しました`)},
  delDay:()=>{const p=P(),s=snap(),n=ui.day+1;p.days.splice(ui.day,1);ui.day=Math.max(0,ui.day-1);save();render();toast(`DAY ${n} を削除しました`,restore(s))},
  goStock:()=>{ui.tab='stock';render();scrollTo({top:0})},
  mode:el=>{const v=el.dataset.i;modeIdx=isNaN(+v)?v:+v;openSheet(modeHTML)},
  setMode:el=>{const d=D();if(modeIdx==='from')d.fromMode=el.dataset.m;else if(modeIdx==='to')d.toMode=el.dataset.m;else d.items[modeIdx].mode=el.dataset.m;save();render();closeSheet()},
  detail:(el,e)=>{if(e.target.closest('[data-handle]'))return;openDetail(el.dataset.sid,el.dataset.i!=null?+el.dataset.i:null)},
  dCancel:()=>{if(detail?.snap){restore(detail.snap)();save();render()}closeSheet()},
  stay:el=>{const s=S(detail.sid);s.stay=Math.max(0,(+s.stay||0)+ +el.dataset.v);save();refreshSheet();render()},
  move:el=>{const d=D(),i=d.items.findIndex(x=>x.spot===detail.sid&&(detail.i==null||d.items.indexOf(x)===detail.i)),j=i+ +el.dataset.v;
    if(i<0||j<0||j>=d.items.length)return;[d.items[i],d.items[j]]=[d.items[j],d.items[i]];detail.i=j;save();render();refreshSheet()},
  unplan:el=>{const s=snap(),d=D(),[x]=d.items.splice(+el.dataset.i,1);save();closeSheet();render();toast(`「${S(x.spot).name}」を予定から外しました`,restore(s))},
  toDay:el=>{const sid=el.dataset.sid;if(P().days.length>1){dayPick=sid;openSheet(dayPickHTML);return}if(tryAddToDay(sid)){if(SHEETS.length&&detail)refreshSheet();render()}},
  pickDay:el=>{const di=+el.dataset.i,sid=dayPick;closeSheet();setTimeout(()=>{ui.day=di;if(tryAddToDay(sid,di)){render();if(detail)refreshSheet()}else render()},220)},
  dupYes:()=>{const x=dupAsk;closeSheet();addToDay(x.sid,x.di);render();if(detail)setTimeout(refreshSheet,220)},
  editSpot:el=>{detail&&(detail.snap=null);closeSheet();setTimeout(()=>openForm(S(el.dataset.sid)),210)},
  newSpot:()=>openForm(),
  close:()=>closeSheet(),
  planMenu:()=>openSheet(planHTML),
  switchPlan:el=>{db.cur=el.dataset.id;setTimeout(autoPhotoAll,500);ui.day=0;ui.fRes=null;ui.fState='';fitKey='';save();closeSheet();render()},
  newPlan:()=>{closeSheet();setTimeout(ACT.homeNew,220)},
  newPlanOld:()=>{const p=mkPlan();db.plans.push(p);db.cur=p.id;ui.day=0;fitKey='';save();closeSheet();render();setTimeout(()=>{openSheet(planHTML);const i=document.querySelector('.sheet [data-f="title"]');i&&(i.select(),i.focus())},250)},
  dupPlan:()=>{const x=JSON.parse(snap());x.id=uid();x.title+='（コピー）';db.plans.push(x);db.cur=x.id;save();closeSheet();render();toast('プランを複製しました')},
  delPlan:()=>{closeSheet();setTimeout(()=>openSheet(delPlanHTML),220)},
  delPlanYes:()=>{const s=snap(),p=P();db.plans=db.plans.filter(x=>x.id!==p.id);if(!db.plans.length)db.plans.push(mkPlan());db.cur=db.plans[0].id;ui.day=0;ui.tab='home';fitKey='';save();closeSheet();render();toast(`「${p.title}」を削除しました`,()=>{restore(s)();db.cur=p.id})},
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download=`router-${new Date().toLocaleDateString('sv-SE')}.json`;a.click();toast('書き出しました')},
  import:()=>$('#fileImport').click(),
  share:()=>openSheet(shareHTML),
  shareText:()=>doShare(),
  shareLink:()=>shareLink(),
  takeIn:()=>takeIn(),
  here:()=>{if(!navigator.geolocation)return toast('現在地を取得できません');toast('現在地を取得中…');
    navigator.geolocation.getCurrentPosition(p=>{ui.here={lat:p.coords.latitude,lng:p.coords.longitude};ui.fArea='現在地';renderStock();find()},()=>toast('現在地を取得できませんでした'),{timeout:10000})},
  fGenre:el=>{ui.fGenre=el.dataset.g;if(ui.fRes||ui.fState)find();else renderStock()},
  fRad:el=>{ui.fRad=+el.dataset.v;if(ui.fRes)find();else renderStock()},
  find:()=>find(),
  resAdd:el=>{addRes(ui.fRes[+el.dataset.i]);save();render();toast('候補にストックしました')},
  resAll:()=>{ui.fRes.forEach(addRes);save();render();toast(`${ui.fRes.length}件をストックしました`)},
  f2:el=>{ui[el.dataset.k]=el.dataset.v;renderStock()},
  cands:()=>{ui.showCands=!ui.showCands;fitKey='';drawMap()},
  fly:el=>{if(SET.mapKind!=='app'){const r=calc(D()).rows[+el.dataset.i];if(r)openURL(gmaps(r.s));return}const i=+el.dataset.i,r=calc(D()).rows[i];ui.hl=i;renderMapUI();if(MAP&&hasLL(r.s))MAP.flyTo([r.s.lat,r.s.lng],Math.max(MAP.getZoom(),15),{duration:.6});
    if(el.classList.contains('hl')&&ui.hl===i&&el.dataset.tap){openDetail(r.s.id,i)}el.dataset.tap=1},
  photo:el=>{photoTarget=el.dataset.draft?{draft:1}:{sid:el.dataset.sid};photoRes=null;openSheet(photoHTML)},
  upload:()=>$('#filePhoto').click(),
  photoSearch:()=>photoSearch(),
  setPhoto:el=>applyPhoto(el.dataset.u),
  dGenre:el=>{const prev=gOf(draft.genre).stay;draft.genre=el.dataset.g;document.querySelectorAll('#dG .chip').forEach(c=>c.classList.toggle('on',c.dataset.g===draft.genre));
    if(draft._new&&(+draft.stay===prev||!draft.stay)){draft.stay=gOf(draft.genre).stay;$('#dStay').textContent=dur(draft.stay)}
    const h=$('#fHero');if(h&&!draft.photo)h.innerHTML=ph(draft,'',`<button class="btn sm chg" data-act="photo" data-draft="1">${I.cam}写真を追加</button>`)},
  dStay:el=>{draft.stay=Math.max(0,(+draft.stay||0)+ +el.dataset.v);$('#dStay').textContent=dur(draft.stay)},
  locSearch:async()=>{const q=($('#locQ').value||draft.name||'').trim();if(!q)return;const box=$('#locRes');box.innerHTML='<div class="state">検索中…</div>';
    locRes=await searchPlaces(q);box.innerHTML=locRes.length?locRes.map((x,i)=>`<button data-act="locPick" data-i="${i}">📍 ${esc(x.name)}</button>`).join(''):'<div class="state">見つかりませんでした。地図をタップして指定してください。</div>'},
  locPick:el=>{const x=locRes[+el.dataset.i];setLL(x.lat,x.lng);pickMap&&pickMap.setView([x.lat,x.lng],16);if(!draft.name){draft.name=x.name.split(',')[0];document.querySelector('[data-f="d.name"]').value=draft.name}$('#locRes').innerHTML=''},
  saveSpot:()=>{if(!draft.name?.trim()){toast('名前を入力してください');document.querySelector('[data-f="d.name"]')?.focus();return}
    const p=P(),isNew=draft._new;delete draft._new;draft.name=draft.name.trim();
    if(isNew)p.spots.push(draft);else Object.assign(S(draft.id),draft);
    const s=S(draft.id);save();closeSheet();render();autoPhoto(s);toast(isNew?'候補に追加しました':'保存しました')},
  delSpot:()=>{const s=snap(),p=P(),id=draft.id,n=draft.name;p.spots=p.spots.filter(x=>x.id!==id);p.days.forEach(d=>d.items=d.items.filter(i=>i.spot!==id));save();closeSheet();render();toast(`「${n}」を削除しました`,restore(s))}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){f(el,e)}});

/* ================= 進捗（ゴーストレース・ガント） ================= */
const TODAY=()=>new Date().toLocaleDateString('sv-SE');
function progress(d){
  const c=calc(d);if(!c.rows.length)return null;
  const base=new Date((d.date||TODAY())+'T00:00').getTime(),now=Date.now();
  const rows=c.rows.map(r=>({...r,A:base+r.arr*60e3,Dp:base+r.dep*60e3}));
  const live=it=>GEO.watch!=null&&presence&&presence.iid===it.id&&now-presence.last<3*60e3;
  let k=-1;rows.forEach((r,i)=>{if(r.it.v||live(r.it))k=i});
  const start=rows[0].A,end=rows.at(-1).Dp;let delay=0,state;
  if(k<0){state=now<start?'pre':'run';delay=state==='run'?now-start:0}
  else{const r=rows[k],v=r.it.v;
    if(live(r.it)||!v){delay=Math.max((v?v.a:presence.since)-r.A,now-r.Dp);state='at'}
    else if(rows[k+1]){delay=Math.max(v.d-r.Dp,now-rows[k+1].A);state='move'}
    else{delay=v.d-r.Dp;state='goal'}}
  return {rows,k,start,end,delay,state,now,live};
}
function raceHTML(g,d){
  const m=Math.round(g.delay/60e3),am=Math.abs(m),span=Math.max(1,g.end-g.start);
  const pos=t=>Math.max(0,Math.min(100,(t-g.start)/span*100));
  let cls='ok',emo='',big='ほぼ予定どおり',sub='';
  const fin=new Date(g.end+g.delay);
  if(g.state==='pre'){const w=g.start-g.now;cls='ok';emo='⏳';big=w>864e5?`スタートまで あと${Math.ceil(w/864e5)}日`:`スタートまで あと${dur(w/60e3)}`;sub=`${fmtDate(d.date||TODAY())} ${fmtT(toMin(d.start))} スタート`}
  else if(g.state==='goal'){emo='🏁';big='ゴール！';cls=m>5?'late':m<-5?'early':'ok';sub=am<=5?'ほぼ予定どおりにフィニッシュ':`予定より${am}分${m>0?'おそく':'はやく'}フィニッシュ`}
  else{
    if(m<=-5){cls='early';emo='⚡';big=`${am}分はやい`}
    else if(m<5){cls='ok';emo='👌';big='予定どおり'}
    else if(m<20){cls='warn';emo='🐢';big=`${m}分おくれ`}
    else{cls='late';emo='🔥';big=`${m}分おくれ`}
    sub=`ゴール予想 ${String(fin.getHours()).padStart(2,'0')}:${String(fin.getMinutes()).padStart(2,'0')}（予定 ${fmtT(calc(d).end)}）`;
    if(g.state==='run')sub+=' · 訪問記録なし';
  }
  const ghostP=g.state==='pre'?0:pos(g.now),youP=g.state==='pre'?0:g.state==='goal'?100:pos(g.now-g.delay);
  const next=g.state==='pre'||g.state==='run'?g.rows[0]:g.state==='goal'?null:g.state==='at'?g.rows[g.k+1]:g.rows[g.k+1];
  let rec='';
  if(m>=10&&g.state!=='goal'&&g.state!=='pre'){
    const from=g.state==='at'?g.k+1:Math.max(0,g.k+1);
    const cand=g.rows.slice(from).filter(r=>!r.it.v&&(+r.s.stay||0)>=30).sort((a,b)=>b.s.stay-a.s.stay)[0];
    if(cand){const cut=Math.min(Math.ceil(m/5)*5,cand.s.stay-15);if(cut>=5)rec=`<button class="btn recover" data-act="recover" data-i="${cand.i}" data-m="${cut}">💡 <span><b>リカバリー案</b><br>「${esc(cand.s.name)}」の滞在を${cut}分短くして遅れを取り戻す</span></button>`}
  }
  return `<div class="card race">
    <div class="eyebrow">PACE · ${dayLabel()}</div>
    <div class="race-status ${cls}"><span class="sdot"></span><div><b class="num">${big}</b><small>${sub}</small></div></div>
    <div class="track"><div class="rail"></div><div class="fill" style="width:${youP}%"></div>
      ${g.rows.map(r=>`<div class="cp ${r.it.v?'done':''}" role="button" data-act="detail" data-sid="${r.s.id}" data-i="${r.i}" style="left:${pos(r.A)}%;cursor:pointer" title="${esc(r.s.name)}"></div>`).join('')}
      <div class="goal"></div>
      ${g.state!=='goal'&&g.state!=='pre'?`<div class="pmark" style="left:${ghostP}%"><i>予定</i></div>`:''}
      <div class="ymark" style="left:${youP}%"><i>現在</i></div>
      ${g.state!=='goal'&&g.state!=='pre'&&am>=5?`<div class="gap-tag" style="left:${(ghostP+youP)/2}%">${m>0?'◀':'▶'} ${am}分</div>`:''}
    </div>
    <div class="race-foot">${next?`<span>次は <b role="button" data-act="detail" data-sid="${next.s.id}" data-i="${next.i}" style="text-decoration:underline;text-underline-offset:3px;cursor:pointer">${esc(next.s.name)}</b></span><span class="num">予定 ${fmtT(next.arr)} 着${g.state!=='pre'?` · ${next.A-g.now>0?'あと'+dur((next.A-g.now)/60e3):dur((g.now-next.A)/60e3)+'超過'}`:''}</span>`:`<span>おつかれさまでした！</span><span>${g.rows.filter(r=>r.it.v).length}/${g.rows.length} スポット訪問</span>`}</div>
    ${rec}
  </div>`;
}
function ganttHTML(g){
  const PX=1.15,acts=g.rows.flatMap(r=>r.it.v?[r.it.v.a,r.it.v.d]:[]);
  let T0=Math.min(g.start,...acts),T1=Math.max(g.end,...acts);
  const showNow=g.now>T0-3*36e5&&g.now<T1+3*36e5;if(showNow){T0=Math.min(T0,g.now);T1=Math.max(T1,g.now)}
  T0=Math.floor((T0-30*60e3)/36e5)*36e5;T1=Math.ceil((T1+30*60e3)/36e5)*36e5;
  const x=t=>(t-T0)/60e3*PX,W=x(T1);
  let ticks='';for(let t=T0;t<=T1;t+=36e5){const h=new Date(t);ticks+=`<div class="${h.getHours()===0?'g-day':'g-tick'}" style="left:${x(t)}px"><span>${h.getHours()===0?(h.getMonth()+1)+'/'+h.getDate()+' ':''}${h.getHours()}:00</span></div>`}
  const rows=g.rows.map((r,i)=>{
    const v=r.it.v,lv=g.live(r.it)&&!v,miss=!v&&!lv&&g.now>r.Dp&&g.k>i;
    const prev=g.rows[i-1];
    return `<div class="g-row">
      ${prev?`<div class="g-leg" style="left:${x(prev.Dp)}px;width:${Math.max(0,x(r.A)-x(prev.Dp))}px"><span>${MODES[r.it.mode].e}</span></div>`:''}
      <div role="button" data-act="detail" data-sid="${r.s.id}" data-i="${i}" class="g-bar ${v?'done':''} ${lv?'cur':''} ${miss?'miss':''}" style="left:${x(r.A)}px;width:${Math.max(26,x(r.Dp)-x(r.A))}px" title="${esc(r.s.name)}"><b>${v?'✓':i+1}</b>${esc(r.s.name)}</div>
      ${v?`<div class="g-act" style="left:${x(v.a)}px;width:${Math.max(4,x(v.d)-x(v.a))}px"></div>`:''}
      ${lv?`<div class="g-act live" style="left:${x(presence.since)}px;width:${Math.max(4,x(g.now)-x(presence.since))}px"></div>`:''}
    </div>`}).join('');
  return `<div class="card gantt-card"><div class="ttl"><span>タイムライン<small class="dl">${dayLabel()}</small></span><span class="lg"><i style="background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)"></i>予定</span><span class="lg"><i style="background:#1F9D74"></i>実績</span></div>
    <div class="gantt" id="gantt"><div class="g-in" style="width:${W}px"><div class="g-axis">${ticks}</div>${rows}
    ${showNow?`<div class="g-now" style="left:${x(g.now)}px"><span>NOW ${hmS(g.now)}</span></div>`:''}</div></div>
    <div class="note" style="padding:0 16px">帯をタップすると詳細を確認・変更できます。</div></div>`;
}
const hmS=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function renderProg(){
  const el=$('#pane-prog');if(!el)return;

  if(!g){el.innerHTML=h+`<div class="card empty" style="margin-top:16px">${pinkun(88)}<b>予定を作るとレースが始まります</b>スケジュールにスポットを追加すると、予定と実際の進み具合を比べられます。<div style="margin-top:16px"><button class="btn pri" data-act="goStock">${I.plus}候補を追加</button></div></div>`;return}

/* --- 進捗の追加機能 --- */
const WX={},WXI=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌦️':'⛈️';
async function loadWeather(d){
  if(!SET.weather)return;
  const date=d.date||TODAY(),sp=d.items.map(i=>S(i.spot)).find(hasLL);if(!sp)return;
  const key=date+'|'+sp.lat.toFixed(1)+','+sp.lng.toFixed(1);if(WX[key]!==undefined)return;WX[key]=null;
  const diff=(new Date(date+'T00:00')-new Date(TODAY()+'T00:00'))/864e5;if(diff<0||diff>14)return;
  try{const j=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lng}&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Asia%2FTokyo&start_date=${date}&end_date=${date}`,10000);
    WX[key]=j.hourly;if(ui.tab==='prog'||ui.tab==='plan')render()}catch(_){}
}
function wxAt(d,min){if(!SET.weather)return null;const sp=d.items.map(i=>S(i.spot)).find(hasLL);if(!sp)return null;const h=WX[(d.date||TODAY())+'|'+sp.lat.toFixed(1)+','+sp.lng.toFixed(1)];if(!h)return null;
  const i=Math.min(23,Math.max(0,Math.floor(min/60)));return {e:WXI(h.weathercode[i]),t:Math.round(h.temperature_2m[i]),p:h.precipitation_probability?.[i]??null}}
// 移動距離（おでかけモード中の実測）
const TRK=()=>{try{return JSON.parse(localStorage.getItem('router-track'))||{}}catch(_){return {}}};
function trackPos(pos){if(pos.acc>60)return;const t=TRK(),k=TODAY(),cur=t[k]||{km:0};
  if(cur.lat!=null){const m=dist(cur,pos);if(m<.015)return;if(m<2)cur.km+=m}cur.lat=pos.lat;cur.lng=pos.lng;t[k]=cur;try{localStorage.setItem('router-track',JSON.stringify(t))}catch(_){}}
const dayLabel=()=>{const d=D();return `DAY ${ui.day+1}${d.date?' · '+fmtDate(d.date):''}`};
function ringHTML(g,d){
  const n=g.rows.length,v=g.rows.filter(r=>r.it.v).length,pct=n?Math.round(v/n*100):0,R=34,C=2*Math.PI*R;
  const walked=(TRK()[d.date||TODAY()]||{}).km||0,elapsed=Math.max(0,g.now-g.start);
  return `<div class="card ring"><div class="eyebrow rg-e">${dayLabel()}</div><svg viewBox="0 0 84 84" class="rg"><circle cx="42" cy="42" r="${R}" class="rg-b"/><circle cx="42" cy="42" r="${R}" class="rg-f" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg>
    <div class="rg-n num"><b>${pct}<em>%</em></b><small>達成</small></div>
    <div class="rg-s"><div><small>訪問</small><b class="num">${v}<em>/${n}</em></b></div><div><small>移動した距離</small><b class="num">${walked.toFixed(1)}<em>km</em></b></div><div><small>${g.state==='pre'?'スタートまで':'経過時間'}</small><b class="num">${g.state==='pre'?dur((g.start-g.now)/60e3):dur(elapsed/60e3)}</b></div></div></div>`;
}
function nextHTML(g,d){
  if(g.state==='goal')return '';
  const cur=g.state==='at'?g.rows[g.k]:null,nx=g.state==='at'?g.rows[g.k+1]:g.state==='pre'||g.state==='run'?g.rows[0]:g.rows[g.k+1];
  if(!nx)return '';
  // 出発すべき時刻＝次の到着予定 − 移動時間
  const leaveAt=nx.A-(nx.leg?nx.leg.min*60e3:0),left=Math.round((leaveAt-g.now)/60e3);
  const w=wxAt(d,nx.arr);
  let big,cls='';
  if(g.state==='move'){const ar=Math.round((nx.A-g.now)/60e3);big=ar>0?`あと ${dur(ar)} で到着予定`:`到着予定を ${dur(-ar)} 過ぎています`;if(ar<0)cls=ar<-10?'late':'soon'}
  else if(g.state==='pre'&&!cur){big=left>0?`あと ${dur(left)} で出発`:'出発の時間です';}else if(left>0){big=`あと ${dur(left)} で出発`;if(left<=10)cls='soon'}else{big=`出発時刻を ${dur(-left)} 過ぎています`;cls='late'}
  const a=cur?cur.s:(g.rows[g.k]?.s),b=nx.s,mode=MODES[nx.it.mode];
  if(SET.nudge&&cls==='soon'&&!ui.nudged?.[nx.it.id]){ui.nudged={...(ui.nudged||{}),[nx.it.id]:1};navigator.vibrate&&navigator.vibrate([60,40,60])}
  return `<div class="card next ${cls}"><div class="eyebrow">NEXT · ${dayLabel()}</div>
    <div class="nx-big num">${big}</div>
    <div class="nx-to" role="button" data-act="detail" data-sid="${b.id}" data-i="${nx.i}">${ph(b,'nx-ph')}<div><b>${esc(b.name)}</b><div class="meta">${fmtT(nx.arr)} 着予定 · ${mode.e} ${mode.n}${nx.leg?' 約'+dur(nx.leg.min):''}${w?` · ${w.e} ${w.t}℃${w.p!=null?' 降水'+w.p+'%':''}`:''}</div></div></div>
    ${a&&hasLL(a)&&hasLL(b)?`<a class="btn block pri" href="${gdir(a,b,nx.it.mode)}" target="_blank" rel="noopener">${I.route}ここまでの経路を開く</a>`:hasLL(b)?`<a class="btn block pri" href="${gmaps(b)}" target="_blank" rel="noopener">${I.pin}地図で開く</a>`:''}
  </div>`;
}
function stampHTML(g){
